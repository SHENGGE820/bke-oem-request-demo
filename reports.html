<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BKE 報表與匯出</title>
  <style>
    :root{--ink:#17231f;--muted:#6d7773;--line:#e4e9e6;--green:#174f3d;--cream:#f7f6f0;--gold:#c39a47;--red:#a8322a;--amber:#9a6500}*{box-sizing:border-box}body{margin:0;background:#f3f5f3;color:var(--ink);font-family:Arial,"Noto Sans TC",sans-serif}button{font:inherit}.app{min-height:100vh;display:flex}.side{width:228px;background:#133d31;color:#fff;padding:28px 18px;display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0}.logo{font:700 26px Georgia;color:#e5bd68;padding:0 10px 30px;border-bottom:1px solid #ffffff26}.logo small{display:block;font:14px Arial;color:white;letter-spacing:.1em;margin-top:5px}.nav{display:grid;gap:8px;margin-top:28px}.nav button{border:0;background:transparent;color:#cbd9d4;text-align:left;padding:13px 14px;border-radius:10px;cursor:pointer}.nav button:hover,.nav button.on{background:#ffffff14;color:white}.user{margin-top:auto;border-top:1px solid #ffffff26;padding:20px 8px 0;font-size:13px}.user small{display:block;color:#9fb4ac;margin-top:3px}.main{margin-left:228px;width:calc(100% - 228px);padding:42px 52px}.top{display:flex;justify-content:space-between;gap:24px;align-items:flex-start}.eyebrow{font-size:11px;color:var(--gold);font-weight:700;letter-spacing:.17em}.top h1{font:600 34px Georgia;margin:5px 0 8px}.top p{margin:0;color:var(--muted)}.actions button{border:1px solid var(--line);background:var(--green);color:white;border-radius:9px;padding:11px 14px;cursor:pointer}.notice{margin:24px 0 16px;padding:12px 15px;border:1px solid #ecd7a9;background:#fff8e8;color:#745013;border-radius:10px;font-size:13px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.stat,.card{background:white;border:1px solid var(--line);border-radius:14px}.stat{padding:18px}.stat span{font-size:13px;color:var(--muted)}.stat b{display:block;font:600 30px Georgia;margin:7px 0}.stat small{font-size:12px;color:#909995}.stat.warn b{color:var(--red)}.roleFlow{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:16px}.roleStage{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px}.roleStage small{color:var(--muted)}.roleStage h3{font:600 16px Georgia;margin:8px 0}.roleStage p{margin:0;color:var(--muted);font-size:12px;line-height:1.5}.roleStage b{color:var(--red)}.grid{display:grid;grid-template-columns:1fr;gap:18px;margin-top:18px}.card{padding:22px}.card h2{font:600 18px Georgia;margin:0 0 18px}.flow{display:grid;gap:15px}.flowRow{display:grid;grid-template-columns:130px 1fr 42px;gap:12px;align-items:center;font-size:13px}.track{height:10px;border-radius:99px;background:#edf1ef;overflow:hidden}.track i{display:block;height:100%;background:linear-gradient(90deg,#347660,#77a792);border-radius:99px}.flowRow b{text-align:right}.table{margin-top:18px;background:white;border:1px solid var(--line);border-radius:14px;overflow:hidden}.tableTop{padding:18px 20px;display:flex;justify-content:space-between;align-items:center}.tableTop h2{font:600 18px Georgia;margin:0}.tableTop small{color:var(--muted)}.head,.row{display:grid;grid-template-columns:1.5fr .8fr 1fr 1fr .7fr;gap:15px;align-items:center}.head{padding:12px 20px;background:#fafbf9;color:#87908c;font-size:11px}.row{padding:16px 20px;border-top:1px solid var(--line);font-size:13px}.row b,.row small{display:block}.row small{color:var(--muted);margin-top:4px}.pill{justify-self:start;padding:6px 9px;border-radius:99px;font-size:11px;font-weight:700}.blue{background:#e3eefb;color:#2e6097}.amber{background:#fff1d6;color:#8b5d00}.green{background:#e1f1e9;color:#216547}.empty{padding:40px;text-align:center;color:var(--muted)}.toast{position:fixed;right:26px;bottom:26px;background:#173f33;color:white;padding:13px 17px;border-radius:10px;box-shadow:0 10px 30px #0002;opacity:0;transform:translateY(10px);transition:.2s}.toast.show{opacity:1;transform:none}@media(max-width:1050px){.roleFlow{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}}@media(max-width:900px){.side{width:76px}.logo small,.nav button,.user{font-size:0}.main{margin-left:76px;width:calc(100% - 76px);padding:25px}.top{flex-direction:column}.head{display:none}.row{grid-template-columns:1fr 1fr}.row span:first-child{grid-column:1/-1}}@media(max-width:560px){.roleFlow,.stats{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="side"><div class="logo">BKE<small>代工需求管理</small></div><nav class="nav"><button onclick="location.href='preview.html'">案件工作台</button><button onclick="location.href='tasks.html?role=manager'">全部待辦</button><button onclick="location.href='case.html'">案件處理</button><button onclick="location.href='role-portal.html'">切換角色</button><button class="on">報表與匯出</button></nav><div class="user">管理者<small>測試環境</small></div></aside>
    <main class="main">
      <header class="top"><div><div class="eyebrow">MANAGEMENT OVERVIEW</div><h1>案件進度總覽</h1><p>這一版開始讀取同一瀏覽器實際建立的 A／B／C 測試案件。</p></div><div class="actions"><button id="exportBtn">下載目前案件清單</button></div></header>
      <div class="notice">目前仍是 localStorage 前台原型；數字只代表這台瀏覽器內的匿名測試案件，不是公司正式營運資料。</div>
      <section class="stats" id="stats"></section>
      <section class="roleFlow" id="roleFlow"></section>
      <section class="grid"><article class="card"><h2>未完成工作依角色分布</h2><div class="flow" id="flow"></div></article></section>
      <section class="table"><div class="tableTop"><h2>目前案件</h2><small>依最近更新排序</small></div><div class="head"><span>案件／客戶</span><span>表單</span><span>目前狀態</span><span>下一工作</span><span>操作</span></div><div id="caseRows"></div></section>
    </main>
  </div>
  <div class="toast" id="toast">案件清單已下載</div>
  <script src="shared-case-store.js"></script>
  <script>
    const stats=document.querySelector('#stats'),roleFlow=document.querySelector('#roleFlow'),flow=document.querySelector('#flow'),caseRows=document.querySelector('#caseRows'),toast=document.querySelector('#toast');
    function safe(value){return String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))}
    function allCases(){return window.BKECases?BKECases.all():[]}
    function activeTasks(cases){return cases.flatMap(item=>(item.tasks||[]).filter(task=>task.status!=='已完成').map(task=>({...task,caseId:item.id,caseTitle:item.title})))}
    function render(){const cases=allCases().sort((a,b)=>String(b.updatedAt||'').localeCompare(String(a.updatedAt||''))),tasks=activeTasks(cases),closed=cases.filter(item=>item.status==='已完成'||item.status==='已結案').length,unassigned=tasks.filter(task=>(task.ownerName||'未指派')==='未指派').length;stats.innerHTML=[["本機測試案件",cases.length,"A／B／C 表建立"],["進行中案件",cases.length-closed,"尚有工作未完成"],["待分派工作",unassigned,"尚未指定負責人"],["已完成案件",closed,"所有工作已完成"]].map((x,i)=>`<div class="stat ${i===2&&x[1]?'warn':''}"><span>${safe(x[0])}</span><b>${safe(x[1])}</b><small>${safe(x[2])}</small></div>`).join('');const roles=['業管','營養師','研發','行銷顧問','其他'];const counts=Object.fromEntries(roles.map(role=>[role,0]));tasks.forEach(task=>{const role=roles.includes(task.ownerRole)?task.ownerRole:'其他';counts[role]++});roleFlow.innerHTML=roles.map(role=>`<article class="roleStage"><small>${safe(role)}</small><h3>${role==='業管'?'客戶確認與結案':role==='營養師'?'配方與產品資料':role==='研發'?'打樣製作':role==='行銷顧問'?'行銷需求':'其他工作'}</h3><p><b>${counts[role]} 件</b>尚未完成。</p></article>`).join('');const max=Math.max(1,...Object.values(counts));flow.innerHTML=roles.map(role=>`<div class="flowRow"><span>${safe(role)}</span><div class="track"><i style="width:${counts[role]/max*100}%"></i></div><b>${counts[role]}</b></div>`).join('');caseRows.innerHTML=cases.length?cases.map(item=>{const next=(item.tasks||[]).find(task=>task.status!=='已完成');return `<div class="row"><span><b>${safe(item.title)}</b><small>${safe(item.customer||'未填客戶')}</small></span><span>${safe(item.type)} 表</span><i class="pill ${item.status==='已完成'||item.status==='已結案'?'green':'blue'}">${safe(item.status||'進行中')}</i><span>${next?safe(`${next.title}｜${next.ownerName==='未指派'?next.ownerRole+'待分派':next.ownerName}`):'全部完成'}</span><a href="case.html?case=${encodeURIComponent(item.id)}">查看</a></div>`}).join(''):'<div class="empty">目前還沒有由 A／B／C 表建立的本機測試案件。</div>'}
    document.querySelector('#exportBtn').onclick=()=>{const cases=allCases(),rows=[['案件編號','表單','案件名稱','客戶','申請人','狀態','建立時間','最後更新'],...cases.map(item=>[item.id,item.type,item.title,item.customer,item.applicant,item.status,item.createdAt,item.updatedAt])];const csv='\ufeff'+rows.map(row=>row.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='BKE_本機測試案件.csv';a.click();URL.revokeObjectURL(url);toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2200)};
    render();
  </script>
</body>
</html>
