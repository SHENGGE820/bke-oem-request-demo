<header class="top"><div class="brand">BKE<span>代工需求管理</span></div><button onclick="location.href='form-versions.html'">返回需求入口</button></header>
<section class="hero"><div class="heroIn"><div><div class="mark">C</div><h1>行銷顧問需求</h1><p>提出官網審稿、產品介紹、教育訓練或外出授課需求。</p><div class="mode">檢查模式：所有欄位都可略過，不會因未填而阻擋。</div></div><div class="roles"><b>提出：</b>業管<br><b>主要承辦：</b>營養師／行銷顧問承辦人</div></div></section>
<div class="layout"><nav class="nav"><a href="#basic">基本資料</a><a href="#web">官網產品審稿</a><a href="#intro">產品介紹 PPT</a><a href="#training">教育訓練</a><a href="#other">其他與歸檔</a></nav>
<form class="form" id="cForm">
<details id="basic" open><summary>基本資料</summary><div class="section grid"><label>申請人員<input name="申請人員"></label><label>申請日期<input type="date" name="申請日期"></label><label>配方需求單號<input name="配方需求單號"></label><label>客戶名稱<input name="客戶名稱"></label><label>資料路徑<input name="資料路徑"></label><label>行銷顧問需求單號（C＋）<input name="行銷顧問需求單號"></label><label>產品名稱<input name="產品名稱"></label><label>配方號碼<input name="配方號碼"></label><label class="wide">產品主訴功能<textarea name="產品主訴功能"></textarea></label><label class="wide">其他需求<textarea name="其他需求"></textarea></label></div></details>
<details id="web" open><summary>官網產品審稿</summary><div class="section"><div class="grid"><label>提出時間<input type="datetime-local" name="官網審稿_提出時間"></label><label>需求時間<input type="date" name="官網審稿_需求時間"></label><label>客戶圖片 NAS 路徑<input name="官網審稿_NAS路徑"></label><label>客戶官網網址<input type="url" name="官網審稿_網址"></label><label>營養師收案時間<input type="datetime-local" name="官網審稿_收案時間"></label><label>收案營養師<input name="官網審稿_營養師"></label><label>群組回覆時間<input type="datetime-local" name="官網審稿_群組回覆"></label></div><div class="sub">校稿紀錄</div><div class="rounds"><div class="round"><b>第一次校稿</b><label>申請日期<input type="date" name="官網第一次_申請日"></label><label>營養師回復<textarea name="官網第一次_回復"></textarea></label></div><div class="round"><b>第二次校稿</b><label>申請日期<input type="date" name="官網第二次_申請日"></label><label>營養師回復<textarea name="官網第二次_回復"></textarea></label></div><div class="round"><b>第三次校稿</b><label>申請日期<input type="date" name="官網第三次_申請日"></label><label>營養師回復<textarea name="官網第三次_回復"></textarea></label></div></div></div></details>
<details id="intro" open><summary>產品介紹 PPT</summary><div class="section grid"><label>提出時間<input type="datetime-local" name="產品介紹PPT_提出時間"></label><label>需求時間<input type="date" name="產品介紹PPT_需求時間"></label><label class="wide">產品主訴功能<textarea name="產品介紹PPT_主訴"></textarea></label><label>收案營養師<input name="產品介紹PPT_營養師"></label><label>營養師收案時間<input type="datetime-local" name="產品介紹PPT_收案時間"></label><label>資料路徑<input name="產品介紹PPT_資料路徑"></label><label>提供時間<input type="datetime-local" name="產品介紹PPT_提供時間"></label></div></details>
<details id="training" open><summary>教育訓練 PPT／外出授課</summary><div class="section"><div class="grid"><label class="wide">需求類型<div class="checks"><label class="check"><input type="checkbox" name="教育訓練類型" value="僅提供PPT">僅提供 PPT</label><label class="check"><input type="checkbox" name="教育訓練類型" value="須外出授課">須外出授課</label></div></label><label>對象<input name="教育訓練對象"></label><label>包含產品（BKE 出品）<input name="教育訓練包含產品"></label><label>需求時間<input type="date" name="教育訓練需求時間"></label><label>收案營養師<input name="教育訓練營養師"></label><label class="wide">客戶需求限制<textarea name="客戶需求限制"></textarea></label></div><div class="sub">外出授課安排</div><div class="grid"><label>外出授課需求時間<input type="date" name="外出授課需求時間"></label><label>收案營養師<input name="外出授課營養師"></label><label>總共場次<input type="number" min="0" name="外出授課場次"></label><label>營養室回覆時間<input type="datetime-local" name="外出授課回覆時間"></label><label>最終敲定時間<input type="datetime-local" name="外出授課敲定時間"></label></div><div class="rounds" style="margin-top:14px"><div class="session"><b>第一場</b><label>客戶期望時間<input type="datetime-local" name="第一場_期望時間"></label><label>地點<input name="第一場_地點"></label><label>課程時間（小時）<input name="第一場_課程時間"></label><label>日期 1<input type="date" name="第一場_日期1"></label><label>日期 2<input type="date" name="第一場_日期2"></label></div><div class="session"><b>第二場</b><label>客戶期望時間<input type="datetime-local" name="第二場_期望時間"></label><label>地點<input name="第二場_地點"></label><label>課程時間（小時）<input name="第二場_課程時間"></label><label>日期 1<input type="date" name="第二場_日期1"></label><label>日期 2<input type="date" name="第二場_日期2"></label></div></div><div class="warning">請業管與客戶準備好筆電，並確認當天資料完成、可正常播放。</div></div></details>
<details id="other" open><summary>其他需求與歸檔</summary><div class="section"><div class="warning">原表明確註記：不提供 SEO 文章及社群文案撰寫。</div><div class="grid" style="margin-top:16px"><label class="wide">其他備註<textarea name="其他備註"></textarea></label><label>歸檔日期<input type="date" name="歸檔日期"></label></div></div></details>
</form></div>
<div class="bottom"><button type="button" onclick="location.href='form-versions.html'">稍後再填</button><button type="button" id="saveBtn">儲存本機草稿</button><button type="button" class="primary" id="createBtn">建立 C 測試案件</button></div><div class="toast" id="toast">已儲存本機草稿</div>
<script src="shared-case-store.js"></script>
<script>
const form=document.getElementById('cForm'),key='bke-c-marketing-request-draft-v1',toast=document.getElementById('toast');
function snapshot(){const out={};form.querySelectorAll('[name]').forEach(el=>{if(el.type==='checkbox'){out[el.name]??=[];if(el.checked)out[el.name].push(el.value)}else out[el.name]=el.value});return out}
function save(show=false){localStorage.setItem(key,JSON.stringify(snapshot()));if(show){toast.classList.add('on');setTimeout(()=>toast.classList.remove('on'),1800)}}
function restore(){try{const data=JSON.parse(localStorage.getItem(key)||'{}');form.querySelectorAll('[name]').forEach(el=>{if(el.type==='checkbox')el.checked=(data[el.name]||[]).includes(el.value);else if(data[el.name]!==undefined)el.value=data[el.name]})}catch(e){}}
restore();form.addEventListener('input',()=>save(false));document.getElementById('saveBtn').onclick=()=>save(true);document.getElementById('createBtn').onclick=()=>{const data=BKECases.snapshot(form),title=data['產品名稱']?`${data['產品名稱']}｜行銷顧問需求`:'行銷顧問需求',created=BKECases.create({type:'C',title,customer:data['客戶名稱'],applicant:data['申請人員'],summary:data,tasks:BKECases.tasksC(data)});localStorage.removeItem(key);location.href=`case.html?case=${encodeURIComponent(created.id)}`};
</script></body></html>
