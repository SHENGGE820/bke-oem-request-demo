<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BKE｜營養師案件審閱</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2ef;color:#17231f;font:16px/1.6 Arial,"Noto Sans TC",sans-serif}button,input,textarea,select{font:inherit}
.top{height:66px;background:#153f33;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 32px;position:sticky;top:0;z-index:10}
.logo{font:700 24px Georgia;color:#e3bd69}.logo small{font:13px Arial;color:white;margin-left:12px}
.top button{border:1px solid #ffffff44;background:transparent;color:white;border-radius:8px;padding:9px 13px;cursor:pointer;font-size:14px}
.wrap{max-width:1160px;margin:24px auto 70px;padding:0 20px}
.crumb{color:#75817b;margin-bottom:14px;font-size:14px}
.hero{background:white;border:1px solid #dee5e1;border-radius:15px;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.hero small{color:#a67d35;font-size:13px}.hero h1{font:600 22px Georgia;margin:3px 0}
.meta{display:flex;flex-wrap:wrap;gap:8px 18px;color:#77827d;font-size:13.5px;margin-top:2px}
.layout{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(310px,1fr);gap:18px;align-items:start;margin-top:18px}
.mainCol{display:block}
.mainCol .card:first-child{margin-top:0}
#formulaCard{scroll-margin-top:80px}
.sideCol{position:sticky;top:84px;display:grid;gap:14px}
.sideCol .card{margin-top:0}
.sideCol .formGrid{grid-template-columns:1fr}
.sideCol .actionCard{padding:18px 20px}
.sideCol .actionCard h2{font-size:19px}
@media(max-width:900px){.layout{grid-template-columns:1fr}.sideCol{position:static}}
.pill{background:#fff0d2;color:#855b00;border-radius:99px;padding:8px 14px;font-weight:bold;white-space:nowrap}
.card{background:white;border:1px solid #dee5e1;border-radius:16px;padding:24px 26px;margin-top:18px}
.actionCard{display:flex;gap:18px;align-items:flex-start;border:1px solid #bad7ca;background:linear-gradient(135deg,#f2faf6,#eef7f1)}
.actionCard .icon{font-size:34px;line-height:1}
.actionCard h2{margin:0 0 6px;font:700 21px Georgia;color:#174f3d}
.actionCard p{margin:0;color:#4d5e56;font-size:15px;line-height:1.6}
.card h2.sectionTitle{margin:0 0 6px;font:700 20px Georgia;color:#174f3d}
.card p.sectionSub{margin:0 0 18px;color:#6f7c76;font-size:14px}
.workflowStatus{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;border:1px solid #dbe6e1;background:#f5faf7;border-radius:12px;padding:16px 18px;margin-bottom:20px}
.workflowStatus strong{display:block;color:#174f3d;margin-bottom:6px;font-size:16px}
.workflowStatus p{margin:0;color:#5c6b64;line-height:1.6;font-size:14.5px}
.workflowStatus .state{white-space:nowrap;border-radius:99px;padding:7px 12px;background:#e4f0eb;color:#195741;font-size:12.5px;font-weight:700}
.workflowStatus.returned{background:#fff8e8;border-color:#ecd6a8}
.workflowStatus.returned strong,.workflowStatus.returned .state{color:#795619}
.workflowStatus.returned .state{background:#fff0d0}
.requestedFields{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.requestedFields span{border:1px solid #e2c98e;background:#fffaf0;border-radius:99px;padding:6px 10px;color:#76551e;font-size:12.5px}
.changeList{display:grid;gap:9px;margin:14px 0 0}
.changeItem{border-left:3px solid #c7963c;background:#fffaf0;padding:10px 12px;border-radius:6px}
.changeItem b{display:block;font-size:13px;margin-bottom:3px}
.changeItem span{font-size:13px;color:#6d6250;white-space:pre-wrap}
.summaryGrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.box{border:1px solid #e2e7e4;border-radius:12px;padding:16px 18px;line-height:1.6}
.box.wide{grid-column:1/-1}
.box span{display:block;color:#7d8782;font-size:13px;margin-bottom:7px;font-weight:700}
.box.missing{border-color:#ecd6a8;background:#fff8e8;color:#795619;font-weight:700}
.summaryEmoji{margin-right:6px}
@media(max-width:640px){.summaryGrid{grid-template-columns:1fr}}
.reviewGroup{border:1px solid #e5eae7;border-radius:12px;padding:12px 16px 4px;margin-top:12px;background:#fbfdfc}
.reviewGroup>h4{margin:0;font:700 13.5px Arial;color:#5a6b62;letter-spacing:.3px}
.reviewGroup .kv{display:grid;grid-template-columns:1fr 1fr;gap:0 22px;margin-top:6px}
.kvItem{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-bottom:1px solid #eef2f0}
.kvItem .k{font-size:12px;color:#8a938d}
.kvItem .v{font-size:14.5px;color:#1f2d27;line-height:1.5;white-space:pre-wrap}
.kvItem.miss{background:#fffaf1;border-radius:6px;padding:8px 8px;margin:0 -8px}
.kvItem.miss .v em{font-style:normal;color:#b5892f;font-weight:700}
.kvItem.full{grid-column:1/-1}
@media(max-width:560px){.reviewGroup .kv{grid-template-columns:1fr}}
.formGrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.formGrid label,.supplementGrid label{display:grid;gap:8px;font-size:14px;font-weight:700;color:#28362f}
.formGrid input,.formGrid textarea,.supplementGrid input,.supplementGrid select,.supplementGrid textarea{width:100%;padding:12px;border:1px solid #d5deda;border-radius:9px;background:#fff;font-size:15px}
.formGrid textarea,.supplementGrid textarea{min-height:96px;resize:vertical}
.formGrid .wide,.supplementGrid .wide{grid-column:1/-1}
.supplementGrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px}
.fieldHelp{font-size:12.5px;color:#7d8983;font-weight:normal}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px}
.actions button{border:1px solid #cbd8d2;background:#fff;color:#174f3d;border-radius:10px;padding:12px 18px;cursor:pointer;font-weight:700;font-size:15px}
.actions button.primary{background:#174f3d;border-color:#174f3d;color:#fff}
.intakeComplete{border:1px solid #cfe1d8;background:#f1f8f4;border-radius:12px;padding:18px}
.intakeComplete b{color:#17533f;font-size:15px}
.intakeComplete dl{display:grid;grid-template-columns:130px 1fr;gap:9px 14px;margin:14px 0 0;font-size:14.5px}
.intakeComplete dt{color:#718078}.intakeComplete dd{margin:0}
.workSection{border:1px solid #dfe7e3;border-radius:14px;padding:20px;background:#fff;margin-top:16px}
.workSectionHead{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;margin-bottom:16px}
.workSectionHead h3{margin:0 0 4px;color:#174f3d;font:700 19px Georgia}
.workSectionHead p{margin:0;color:#748079;font-size:13.5px;line-height:1.5}
.sectionBadge{border-radius:99px;background:#e8f2ee;color:#17543f;padding:6px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.smallButton{border:1px solid #cbd8d2;background:#fff;color:#174f3d;border-radius:9px;padding:9px 12px;cursor:pointer;font-weight:700}
.formulaMeta{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:16px}
.formulaMeta label,.quoteGrid label{display:grid;gap:7px;font-size:13.5px;font-weight:700}
.formulaMeta input,.formulaMeta select,.quoteGrid input,.quoteGrid select,.quoteGrid textarea{width:100%;padding:11px;border:1px solid #d5deda;border-radius:9px;background:#fff}
.formulaTable{display:grid;gap:10px}
.formulaRow{display:grid;grid-template-columns:1.4fr .7fr .8fr 1.2fr auto;gap:10px;align-items:end;padding:12px;background:#f7faf8;border-radius:10px}
.formulaRow label{display:grid;gap:6px;color:#68756e;font-size:12px;font-weight:700}
.formulaRow input,.formulaRow select{width:100%;padding:10px;border:1px solid #d5deda;border-radius:8px;background:#fff}
.formulaRow .removeIngredient{border:0;background:#fff0ee;color:#a23c35;width:38px;height:38px;border-radius:9px;cursor:pointer}
.adjustTable{display:grid;gap:10px}
.adjustRow{display:grid;grid-template-columns:150px 1fr 1fr .9fr auto;gap:10px;align-items:end;padding:12px;background:#f7faf8;border-radius:10px}
.adjustRow label{display:grid;gap:6px;color:#68756e;font-size:12px;font-weight:700}
.adjustRow input,.adjustRow textarea{width:100%;padding:10px;border:1px solid #d5deda;border-radius:8px;background:#fff;font:inherit}
.adjustRow textarea{min-height:44px;resize:vertical}
.adjustRow .removeAdjust{border:0;background:#fff0ee;color:#a23c35;width:38px;height:38px;border-radius:9px;cursor:pointer}
.adjustEmpty{padding:11px 14px;border-radius:9px;background:#f4f7f5;color:#68756e;font-size:13px}
.quoteGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.quoteGrid .wide{grid-column:1/-1}
.quoteTotal{background:#eaf5ef!important;color:#175640;font-weight:800}
.requiredHint{color:#a23c35;font-weight:700}
.formulaHelp,.formulaComplete{padding:13px 16px;border-radius:10px;margin-bottom:16px;font-size:14px}
.formulaHelp{background:#fff8e8;color:#73531d;border:1px solid #ecd6a8}
.formulaComplete{background:#f1f8f4;color:#17533f;border:1px solid #cfe1d8}
@media(max-width:760px){.formulaMeta,.quoteGrid{grid-template-columns:1fr 1fr}.formulaRow{grid-template-columns:1fr 1fr}.formulaRow .removeIngredient{justify-self:end}.adjustRow{grid-template-columns:1fr 1fr}.adjustRow .removeAdjust{justify-self:end}}
@media(max-width:560px){.formGrid,.supplementGrid,.formulaMeta,.quoteGrid,.formulaRow,.adjustRow{grid-template-columns:1fr}}
.side{display:grid;gap:14px;margin-top:18px}
.side .card{margin-top:0}
.side h3{margin:0 0 12px;font:700 16px Georgia;color:#174f3d}
.timeline{list-style:none;margin:0;padding:0;display:grid;gap:10px;font-size:14px}
.timeline li{color:#8b948e;position:relative;padding-left:20px}
.timeline li::before{content:'';position:absolute;left:0;top:6px;width:9px;height:9px;border-radius:50%;background:#cfd8d3}
.timeline li.done{color:#174f3d;font-weight:700}
.timeline li.done::before{background:#174f3d}
.activity{font-size:13.5px;color:#5c6b64;line-height:1.9}
.modal{position:fixed;inset:0;background:#102d2478;display:none;place-items:center;padding:20px;z-index:20}
.modal.show{display:grid}
.dialog{width:min(560px,100%);max-height:calc(100vh - 40px);overflow:auto;background:#fff;border-radius:16px;padding:26px}
.dialog h2{margin:0 0 8px;font:700 21px Georgia;color:#17231f}
.subnote{margin:0 0 16px;color:#66736d;font-size:14px}
.returnChoices{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:16px}
.returnChoices label{font-size:13.5px;display:flex;gap:7px;align-items:center}
.returnChoices label.missField{background:#fff6e9;border:1px solid #f0d9a8;border-radius:7px;padding:4px 9px}
.returnChoices label.missField em{font-style:normal;color:#b5892f;font-weight:700;font-size:11px;margin-left:auto;background:#f6e2b8;padding:1px 7px;border-radius:20px}
.returnHint{grid-column:1/-1;font-size:12.5px;color:#b5892f;background:#fffaf1;border:1px solid #f0e0c0;border-radius:8px;padding:8px 11px;margin:0 0 2px;line-height:1.5}
.dialog textarea{width:100%;min-height:90px;border:1px solid #cbd7d1;border-radius:9px;padding:11px;margin-bottom:16px}
.dialog footer{display:flex;justify-content:flex-end;gap:10px}
.dialog footer button{border:1px solid #d3dcd7;background:#fff;border-radius:9px;padding:11px 16px;cursor:pointer;font-weight:700}
.dialog footer button.primary{background:#174f3d;border-color:#174f3d;color:#fff}
.savedToast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:#174f3d;color:#fff;padding:12px 20px;border-radius:99px;opacity:0;pointer-events:none;transition:.25s;font-size:14px}
.savedToast.show{opacity:1;transform:translate(-50%,0)}
.notFound{background:white;border:1px solid #dee5e1;border-radius:15px;padding:32px;text-align:center;color:#5c6b64}
.reviewActions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px;padding-top:16px;border-top:1px dashed #d8e2dd}
.reviewAct{border:1px solid #cbd8d2;background:#fff;color:#174f3d;border-radius:10px;padding:11px 18px;font-weight:700;cursor:pointer;font-size:15px}
.reviewAct.primary{background:#174f3d;border-color:#174f3d;color:#fff}
.kvItem[data-field-key]{transition:box-shadow .15s,background .15s}
.kvItem.markPick{background:#fff3d6;border-radius:6px;box-shadow:inset 0 0 0 1px #e6c483}
.intakeFocus{animation:intakeFlash 1.7s ease}
@keyframes intakeFlash{0%{box-shadow:0 0 0 0 #f0c96a99}25%{box-shadow:0 0 0 5px #f4d98a77}100%{box-shadow:0 0 0 0 #f0c96a00}}
.floatPanel{position:fixed;top:96px;right:26px;width:326px;max-height:calc(100vh - 132px);background:#fff;border:1px solid #cdddd4;border-radius:14px;box-shadow:0 18px 44px #0d2c2233;z-index:30;display:flex;flex-direction:column;overflow:hidden}
.floatPanel[hidden]{display:none}
.floatHead{background:#174f3d;color:#fff;padding:12px 16px;font:700 15px Arial;cursor:move;display:flex;align-items:center;justify-content:space-between;user-select:none}
.floatHead .grip{opacity:.7;font-size:13px;font-weight:normal;margin-left:8px}
.floatClose{border:0;background:transparent;color:#fff;font-size:21px;cursor:pointer;line-height:1;padding:0 2px}
.floatBody{padding:14px 16px;overflow:auto}
.floatHint{margin:0 0 10px;font-size:12.5px;color:#8a6b25;background:#fffaf1;border:1px solid #f0e0c0;border-radius:8px;padding:8px 10px;line-height:1.5}
.floatFields{display:grid;gap:5px}
.floatFields label{display:flex;align-items:center;gap:9px;font-size:13.5px;padding:6px 9px;border-radius:8px;cursor:pointer}
.floatFields label:hover{background:#f2f7f4}
.floatFields label.missField{background:#fff6e9;border:1px solid #f0d9a8}
.floatFields label em{font-style:normal;margin-left:auto;color:#b5892f;font-weight:700;font-size:11px;background:#f6e2b8;padding:1px 7px;border-radius:20px}
.floatNote{display:grid;gap:6px;margin-top:12px;font-size:13px;font-weight:700;color:#28362f}
.floatNote textarea{width:100%;min-height:68px;border:1px solid #cbd7d1;border-radius:9px;padding:10px;font:inherit;resize:vertical}
.floatFoot{border-top:1px solid #e6ece9;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.floatFoot span{font-size:12.5px;color:#6f7c76}
.floatFoot button.primary{background:#174f3d;border:1px solid #174f3d;color:#fff;border-radius:9px;padding:10px 16px;font-weight:700;cursor:pointer}
@media(max-width:640px){.floatPanel{right:12px;left:12px;width:auto}}
</style>
</head>
<body>
<header class="top"><div class="logo">BKE <small>營養師案件審閱</small></div><div><button onclick="location.href='role-portal.html'">切換角色</button> <button onclick="location.href='nutritionist.html'">我的案件</button> <button id="exportXlsxBtn" hidden>⬇ 匯出原表 Excel</button> <button id="exportCaseBtn" hidden>⬇ 匯出本案 CSV</button></div></header>
<main class="wrap">
  <div class="crumb" id="crumb">案件審閱</div>
  <div id="notFound" class="notFound" hidden>找不到這筆案件，可能是連結錯誤或這台裝置沒有這筆本機測試資料。<br><button class="smallButton" style="margin-top:14px" onclick="location.href='nutritionist.html'">回營養師工作台</button></div>
  <div id="caseBody" hidden>
    <section class="hero">
      <div><small id="heroCaseId">單號</small><h1 id="heroTitle">案件標題</h1><div class="meta" id="heroMeta"></div></div>
      <span class="pill" id="statusPill">進行中</span>
    </section>
    <div class="layout">
      <div class="mainCol">
        <section class="card" id="reviewCard"></section>
        <section class="card" id="formulaCard" hidden></section>
        <div class="side">
          <section class="card"><h3>案件進度</h3><ol class="timeline" id="timeline"></ol></section>
          <section class="card"><h3>最近活動</h3><div class="activity" id="activity"></div></section>
        </div>
      </div>
      <aside class="sideCol">
        <section class="card actionCard" id="actionCard"></section>
        <section class="card" id="intakeCard"></section>
      </aside>
    </div>
  </div>
</main>
<div class="floatPanel" id="supplementPanel" hidden><header class="floatHead" id="supplementHead">🖊 逐欄標記補件<span class="grip">（可拖曳）</span><button type="button" class="floatClose" id="closeSupplement" aria-label="關閉">×</button></header><div class="floatBody"><p class="floatHint" id="supplementHint"></p><div class="floatFields" id="supplementFields"></div><label class="floatNote">補充說明<textarea id="supplementNote" placeholder="例如：目標成本請補上每顆或每包的計價單位"></textarea></label></div><footer class="floatFoot"><span id="supplementCount">已選 0 項</span><button type="button" class="primary" id="submitSupplement">送出退回補件</button></footer></div>
<div class="savedToast" id="savedToast">已儲存</div>
<script src="vendor/xlsx.bundle.js"></script>
<script src="xlsx-export.js"></script>
<script src="shared-case-store.js"></script>
<script>
const{A_CORE_FIELDS,A_OPTIONAL_FIELDS,FIELD_OPTIONS,summaryFilled}=window.BKECases||{};
if('scrollRestoration' in history)history.scrollRestoration='manual';
function safe(value){return String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))}
function summaryText(value){return Array.isArray(value)?value.join('、'):String(value??'')}
function today(){const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
const savedToast=document.querySelector('#savedToast');
function toast(message){savedToast.textContent=message;savedToast.classList.add('show');setTimeout(()=>savedToast.classList.remove('show'),1800)}
function summaryIcon(name){return name.includes('日期')?'📅':name.includes('客戶')?'🏢':name.includes('申請')?'👤':name.includes('產品')||name.includes('劑型')?'💊':name.includes('族群')||name.includes('年齡')?'👥':name.includes('功能')||name.includes('調理')?'✨':name.includes('成本')||name.includes('售價')?'💰':name.includes('數量')||name.includes('單位')?'📦':name.includes('配方')?'🧪':name.includes('特殊')?'⚠️':name.includes('出口')?'🌏':'📌'}
const UNIT_SUFFIX={'目標成本':'元／單位','產品售價':'元','粉劑規格':'g／包','錠劑重量':'mg／顆','液態規格':'ml／份','果凍規格':'g／份'};
const DOSAGE_SPEC_KEYS=['粉劑規格','膠囊材質','膠囊號數','錠劑形式','錠劑重量','液態規格','果凍規格','其他劑型說明'];
function withUnit(key,text){const u=UNIT_SUFFIX[key];return u&&/^\d/.test(text)?`${text} ${u}`:text}
function supplementEditor(field){const key=field.key||field,label=field.label||field,value=sharedCase.summary?.[key]??'',array=Array.isArray(value),opt=FIELD_OPTIONS[key];if(opt&&opt.type==='select'){const options=['',...opt.options];return`<label>${safe(label)}<select data-supplement-field="${safe(key)}">${options.map(o=>`<option value="${safe(o)}" ${o===value?'selected':''}>${o||'請選擇'}</option>`).join('')}</select></label>`}if(opt&&opt.type==='multiselect'){const values=array?value:(value?[value]:[]);return`<label class="wide">${safe(label)}<select multiple data-supplement-field="${safe(key)}" data-array="true" size="${Math.min(opt.options.length,6)}">${opt.options.map(o=>`<option value="${safe(o)}" ${values.includes(o)?'selected':''}>${safe(o)}</option>`).join('')}</select><span class="fieldHelp">按住 Ctrl／⌘ 可複選。</span></label>`}const long=array||['客戶需求','配方說明','特殊需求','族群','族群年齡','調理部位','期望功能'].includes(key);const help=array?'<span class="fieldHelp">多項內容請用「、」分隔。</span>':'';return`<label class="${long?'wide':''}">${safe(label)}${long?`<textarea data-supplement-field="${safe(key)}" data-array="${array}">${safe(summaryText(value))}</textarea>`:`<input data-supplement-field="${safe(key)}" value="${safe(value)}">`}${help}</label>`}

const requestedCaseId=new URLSearchParams(location.search).get('case');
let sharedCase=requestedCaseId&&window.BKECases?BKECases.find(requestedCaseId):null;

if(!sharedCase||sharedCase.type!=='A'){
  document.querySelector('#notFound').hidden=false;
}else{
  document.querySelector('#caseBody').hidden=false;
  init();
}

function init(){
  const intake=(sharedCase.tasks||[]).find(t=>t.title==='營養師收案與資料確認');
  const formula=(sharedCase.tasks||[]).find(t=>t.title==='配方與報價');
  if(!intake){document.querySelector('#notFound').hidden=false;document.querySelector('#caseBody').hidden=true;return}

  document.title=`BKE｜${sharedCase.title}`;
  document.querySelector('#crumb').textContent=`A 表案件審閱／${sharedCase.title}`;
  document.querySelector('#heroCaseId').textContent=`單號 ${sharedCase.id}`;
  document.querySelector('#heroTitle').textContent=sharedCase.title;
  document.querySelector('#heroMeta').innerHTML=`<span>${safe(sharedCase.customer)}</span><span>申請人員：${safe(sharedCase.applicant)}</span><span>建立時間：${new Date(sharedCase.createdAt).toLocaleString('zh-TW',{hour12:false})}</span>`;
  document.querySelector('#statusPill').textContent=sharedCase.status||'進行中';

  renderTimeline();
  renderActivity();
  renderAction(intake,formula);
  renderReview(intake);
  renderIntake(intake);
  renderFormula(intake,formula);
  bindSupplementPanel(intake);
  bindExport();

  const exportBtn=document.querySelector('#exportCaseBtn');
  exportBtn.hidden=false;
  const exportXlsxBtn=document.querySelector('#exportXlsxBtn');
  if(exportXlsxBtn&&window.BKEFormXlsx){exportXlsxBtn.hidden=false;exportXlsxBtn.onclick=()=>{BKEFormXlsx.exportCase(sharedCase);toast('已依原 A 表版面匯出 Excel')};}

  const view=new URLSearchParams(location.search).get('view');
  const formulaCard=document.querySelector('#formulaCard');
  if(view==='formula'&&formulaCard&&!formulaCard.hidden){
    const go=()=>formulaCard.scrollIntoView({block:'start'});
    setTimeout(go,150);setTimeout(go,450);window.addEventListener('load',go);
  }
}

function renderTimeline(){
  const stages=['需求已建立','營養師確認','配方與調整','打樣確認','結案'];
  const doneCount=(sharedCase.tasks||[]).filter(t=>t.status==='已完成').length;
  document.querySelector('#timeline').innerHTML=stages.map((label,i)=>`<li class="${i<doneCount?'done':''}">${safe(label)}</li>`).join('');
}

function renderActivity(){
  const list=(sharedCase.activities||[]).slice().reverse().slice(0,10);
  document.querySelector('#activity').innerHTML=list.length?list.map(a=>`${new Date(a.at).toLocaleString('zh-TW',{hour12:false})}　${safe(a.text)}`).join('<br>'):'尚無活動紀錄';
}

function renderAction(intake,formula){
  const card=document.querySelector('#actionCard');
  const returned=intake.status==='等待補件'&&intake.ownerRole==='業管';
  const confirming=intake.status==='等待確認';
  const doneIntake=intake.status==='已完成';
  const formulaActive=doneIntake&&formula&&formula.status!=='已完成';
  const allDone=doneIntake&&formula&&formula.status==='已完成';
  let icon='🔎',title='請先審閱需求內容',copy='資料足夠就可以直接接受案件；不足的話勾選欄位退回業管補充，不需要重開表單。';
  if(returned){icon='⏳';title='已退回業管，等待補件中';copy='目前輪到業管處理，業管補完後會自動送回，這裡會出現「請再次確認」。'}
  else if(confirming){icon='🔁';title='業管已完成補件，請再次確認';copy='下面「需求內容」與「收案決定」已經是最新資料，確認沒問題就能直接進入配方與報價。'}
  else if(formulaActive){icon='🧪';title='請填寫配方與報價';copy='初步配方號碼（必填）與原料成本、加工費用都在下面同一頁完成，不用切換頁面。'}
  else if(allDone){icon='✅';title='這筆案件已完成收案與配方報價';copy='下面保留完整記錄，可查看或匯出。'}
  card.innerHTML=`<div class="icon">${icon}</div><div><h2>${safe(title)}</h2><p>${safe(copy)}</p></div>`;
}

function renderReview(intake){
  const card=document.querySelector('#reviewCard'),summary=sharedCase.summary||{};
  const missing=BKECases.coreMissing(summary);
  const groups=[['① 產品與對象',['產品類別','族群','族群年齡','調理部位','期望功能']],['② 需求與成本',['客戶需求','目標成本','產品售價']],['③ 劑型與包裝',['目標劑型','配方方式','每盒數量','每盒單位']],['④ 限制與出口',['特殊需求','出口國別']]];
  const byLabel=new Map(A_CORE_FIELDS.map(([key,label])=>[label,{key,label}]));
  const used=new Set();
  const kvItem=(key,label)=>{let value=summary[key],filled=summaryFilled(value);if(key==='出口國別'&&!filled&&!BKECases.exportsAbroad(summary)){value='僅供內銷（台灣）';filled=true}const text=withUnit(key,summaryText(value)),wide=filled&&text.length>34;return`<div class="kvItem ${filled?'':'miss'} ${wide?'full':''}" data-field-key="${safe(key)}"><span class="k">${summaryIcon(label)} ${safe(label)}</span><span class="v">${filled?safe(text):'<em>∅ 尚未填寫</em>'}</span></div>`};
  const groupHtml=groups.map(([title,labels])=>{const items=labels.map(l=>{const f=byLabel.get(l);if(!f)return'';used.add(f.label);return kvItem(f.key,f.label)}).join('');return`<div class="reviewGroup"><h4>${title}</h4><div class="kv">${items}</div></div>`}).join('');
  const dosageEntries=DOSAGE_SPEC_KEYS.map(key=>[key,summary[key]]).filter(([,value])=>summaryFilled(value));
  const dosageHtml=dosageEntries.length?`<div class="reviewGroup"><h4>劑型規格</h4><div class="kv">${dosageEntries.map(([k])=>kvItem(k,k)).join('')}</div></div>`:'';
  const leftover=A_CORE_FIELDS.filter(([,label])=>!used.has(label));
  const leftoverHtml=leftover.length?`<div class="reviewGroup"><h4>其他</h4><div class="kv">${leftover.map(([k,l])=>kvItem(k,l)).join('')}</div></div>`:'';
  const optionalEntries=A_OPTIONAL_FIELDS.map(key=>[key,summary[key]]).filter(([,value])=>summaryFilled(value));
  const optionalHtml=optionalEntries.length?`<div class="reviewGroup"><h4>➕ 補充資料</h4><div class="kv">${optionalEntries.map(([name,value])=>`<div class="kvItem full" data-field-key="${safe(name)}"><span class="k">${summaryIcon(name)} ${safe(name)}</span><span class="v">${safe(withUnit(name,summaryText(value)))}</span></div>`).join('')}</div></div>`:'';
  const banner=missing.length?`<div class="workflowStatus returned"><div><strong>⚠ 尚有 ${missing.length} 項基本資料未填寫</strong><p>缺少：${missing.map(([,label])=>safe(label)).join('、')}。建議先退回業管補件，再判斷是否接受案件。</p></div><span class="state">待補件</span></div>`:`<div class="workflowStatus"><div><strong>✓ 基本資料已填寫完整</strong><p>可依下方內容直接判斷是否接受案件。</p></div></div>`;
  const actionable=intake&&intake.status!=='已完成'&&!(intake.status==='等待補件'&&intake.ownerRole==='業管');
  const reviewActions=actionable?`<div class="reviewActions"><button type="button" class="reviewAct" id="markSupplementBtn">🖊 逐欄標記補件</button><button type="button" class="reviewAct primary" id="gotoIntakeBtn">前往收案處理 →</button></div>`:'';
  card.innerHTML=`<h2 class="sectionTitle">📋 需求內容</h2>${banner}${groupHtml}${dosageHtml}${leftoverHtml}${optionalHtml}${reviewActions}`;
}

function renderIntake(intake){
  const card=document.querySelector('#intakeCard'),request=BKECases.activeSupplement?.(sharedCase,intake.id);
  if(intake.status==='等待補件'&&intake.ownerRole==='業管'){
    card.innerHTML=`<h2 class="sectionTitle">⏳ 收案決定</h2><p class="sectionSub">目前輪到業管補件，這裡會在業管送回後自動更新。</p><div class="workflowStatus returned"><div><strong>已退回業管補件</strong><p>${safe(request?.note||intake.note||'')}</p><div class="requestedFields">${(request?.fields||[]).map(f=>`<span>${safe(f.label||f.key||f)}</span>`).join('')}</div></div><span class="state">等待業管</span></div>`;
    return;
  }
  if(intake.status==='已完成'){
    const data=sharedCase.workflowData||{};
    card.innerHTML=`<h2 class="sectionTitle">✓ 收案決定</h2><div class="intakeComplete"><b>資料確認完成，案件已進入配方與報價</b><dl><dt>收案日期</dt><dd>${safe(data['收案日期']||'未記錄')}</dd><dt>收案營養師</dt><dd>${safe(data['收案營養師']||intake.ownerName||'未記錄')}</dd><dt>營養師回覆</dt><dd>${safe(data['營養師回覆']||intake.note||'無')}</dd></dl></div>`;
    return;
  }
  const returned=intake.status==='等待確認'&&request,changes=returned?Object.entries(request.updates||{}):[];
  card.innerHTML=`<h2 class="sectionTitle">🔎 收案決定</h2><p class="sectionSub">${returned?'業管已完成補件，請再次確認。':'先看上方需求內容；資料足夠就接受案件，不足則勾選欄位退回業管。'}</p>${returned?`<div class="workflowStatus returned"><div><strong>業管已回覆</strong><p>${safe(request.responseNote||'業管已更新退回欄位。')}</p><div class="changeList">${changes.map(([name,value])=>`<div class="changeItem"><b>${safe(name)}</b><span>${safe(summaryText(value)||'（空白）')}</span></div>`).join('')}</div></div><span class="state">等待再次確認</span></div>`:''}<div class="formGrid"><label>收案日期<input type="date" id="sharedReceivedDate" value="${safe(sharedCase.workflowData?.['收案日期']||today())}"></label><label>收案營養師<input id="sharedNutritionist" value="${safe(intake.ownerName&&intake.ownerName!=='未指派'?intake.ownerName:BKECases.account('nutrition').name)}"></label><label class="wide">營養師回覆<textarea id="sharedNutritionReply" placeholder="例如：資料已確認，可開始評估配方">${safe(sharedCase.workflowData?.['營養師回覆']||'')}</textarea></label></div><div class="actions"><button type="button" id="sharedReturnBtn">${returned?'仍有缺漏，再次退回':'資料不足，退回補件'}</button><button class="primary" type="button" id="sharedAcceptBtn">${returned?'確認補件並開始配方':'接受案件並開始配方'}</button></div>`;
  document.querySelector('#sharedAcceptBtn').onclick=()=>{
    BKECases.acceptIntake(sharedCase,intake.id,{nutritionist:document.querySelector('#sharedNutritionist').value.trim()||BKECases.account('nutrition').name,reply:document.querySelector('#sharedNutritionReply').value.trim(),date:document.querySelector('#sharedReceivedDate').value||today()});
    location.reload();
  };
}

function bindSupplementPanel(intake){
  const panel=document.querySelector('#supplementPanel'),fieldsBox=document.querySelector('#supplementFields');
  const summary=sharedCase.summary||{};
  const missingKeys=new Set(BKECases.coreMissing(summary).map(([key])=>key));
  const allFields=[...A_CORE_FIELDS.map(([key,label])=>({key,label})),...A_OPTIONAL_FIELDS.map(key=>({key,label:key}))];
  document.querySelector('#supplementHint').textContent=missingKeys.size?`系統偵測到 ${missingKeys.size} 項基本資料未填，已預先勾選（標「缺」），可自行增減。`:'勾選需要業管補充的欄位，勾選時上方需求表會同步標記。';
  fieldsBox.innerHTML=allFields.map(f=>{const miss=missingKeys.has(f.key);return`<label class="${miss?'missField':''}"><input type="checkbox" value="${safe(f.key)}" data-label="${safe(f.label)}" data-miss="${miss?'1':''}" ${miss?'checked':''}><span>${safe(f.label)}</span>${miss?'<em>缺</em>':''}</label>`}).join('');
  const countEl=document.querySelector('#supplementCount');
  const rows=[...document.querySelectorAll('#reviewCard .kvItem[data-field-key]')];
  const syncHighlight=()=>{const checked=new Set([...fieldsBox.querySelectorAll('input:checked')].map(i=>i.value));rows.forEach(el=>el.classList.toggle('markPick',checked.has(el.dataset.fieldKey)));countEl.textContent=`已選 ${checked.size} 項`};
  fieldsBox.querySelectorAll('input').forEach(i=>i.onchange=syncHighlight);
  const open=()=>{panel.hidden=false;syncHighlight()};
  const close=()=>{panel.hidden=true;rows.forEach(el=>el.classList.remove('markPick'))};
  document.querySelector('#closeSupplement').onclick=close;
  const markBtn=document.querySelector('#markSupplementBtn');if(markBtn)markBtn.onclick=open;
  const returnBtn=document.querySelector('#sharedReturnBtn');if(returnBtn)returnBtn.onclick=open;
  const gotoBtn=document.querySelector('#gotoIntakeBtn');
  if(gotoBtn)gotoBtn.onclick=()=>{const target=document.querySelector('#intakeCard');target.scrollIntoView({behavior:'smooth',block:'center'});target.classList.remove('intakeFocus');void target.offsetWidth;target.classList.add('intakeFocus')};
  document.querySelector('#submitSupplement').onclick=()=>{
    const checked=[...fieldsBox.querySelectorAll('input:checked')];
    if(!checked.length){toast('請至少選擇一個補件欄位');return}
    const selected=checked.map(i=>({key:i.value,label:i.dataset.label||i.value}));
    const actor=document.querySelector('#sharedNutritionist')?.value.trim()||BKECases.account('nutrition').name;
    const note=document.querySelector('#supplementNote').value.trim();
    BKECases.returnForSupplement(sharedCase,intake.id,note,selected,actor);
    location.href='nutritionist.html';
  };
  const head=document.querySelector('#supplementHead');let dragging=false,offX=0,offY=0;
  head.addEventListener('mousedown',event=>{if(event.target.closest('.floatClose'))return;dragging=true;const rect=panel.getBoundingClientRect();offX=event.clientX-rect.left;offY=event.clientY-rect.top;panel.style.right='auto';document.body.style.userSelect='none'});
  window.addEventListener('mousemove',event=>{if(!dragging)return;let x=Math.max(6,Math.min(event.clientX-offX,innerWidth-panel.offsetWidth-6)),y=Math.max(6,Math.min(event.clientY-offY,innerHeight-56));panel.style.left=x+'px';panel.style.top=y+'px'});
  window.addEventListener('mouseup',()=>{if(dragging){dragging=false;document.body.style.userSelect=''}});
}

/* 舊版「報價內容」完整區塊（保留供日後移到他處使用，如業管報價頁）。原欄位：
   報價版本 quoteVersion／配方報價提交日期 sharedQuoteDate／報價有效期限 quoteValidUntil／
   報價計價基準 quoteUnit／最低訂購量 minimumOrder／稅別 taxType／原料成本 rawCost／加工費 manufacturingCost／
   包材費 packagingCost／其他費用 otherCost／預估總成本 estimatedCost（自動加總 .costInput）／
   對客報價 customerQuote（原必填）／報價備註 quoteNote。原 recalc 會把所有 .costInput 加總填入 #estimatedCost。
   HTML 範本：
   <section class="workSection"><div class="workSectionHead"><div><h3>報價內容</h3><p>所有成本使用相同報價單位，系統會自動加總預估成本；這些欄位仍是未確認草案，非正式報價規格。</p></div><span class="sectionBadge">業管可查看</span></div><div class="quoteGrid"><label>報價版本<input id="quoteVersion" placeholder="例如：V1"></label><label>配方報價提交日期<input type="date" id="sharedQuoteDate"></label><label>報價有效期限<input type="date" id="quoteValidUntil"></label><label>報價計價基準<select id="quoteUnit">每盒/每瓶/每包/每罐/每件</select></label><label>最低訂購量<input type="number" id="minimumOrder"></label><label>稅別<select id="taxType">未稅/含稅/另議</select></label><label>原料成本／報價單位（元）<input type="number" class="costInput" id="rawCost"></label><label>加工費／報價單位（元）<input type="number" class="costInput" id="manufacturingCost"></label><label>包材費／報價單位（元）<input type="number" class="costInput" id="packagingCost"></label><label>其他費用／報價單位（元）<input type="number" class="costInput" id="otherCost"></label><label>預估總成本／報價單位（元）<input class="quoteTotal" id="estimatedCost" readonly></label><label>對客報價／報價單位（元） *<input type="number" id="customerQuote"></label><label class="wide">報價備註<textarea id="quoteNote"></textarea></label></div></section>
*/
function renderFormula(intake,task){
  const card=document.querySelector('#formulaCard');
  if(!task||intake.status!=='已完成')return;
  card.hidden=false;
  const data=sharedCase.workflowData||{},done=task.status==='已完成';
  let adjustRows=Array.isArray(data['配方溝通調整'])&&data['配方溝通調整'].length?data['配方溝通調整'].map(r=>({date:r.date||'',request:r.request||'',reply:r.reply||'',formulaNo:r.formulaNo||''})):(done?[]:[{date:'',request:'',reply:'',formulaNo:''}]);
  card.innerHTML=`<h2 class="sectionTitle">🧪 配方與報價工作區</h2>${done?'<div class="formulaComplete">✓ 配方與報價已完成，案件已交給研發打樣。下方保留完整配方與報價紀錄。</div>':'<div class="formulaHelp">先填配方號碼（必填）；原料成本、加工費用為選填草案。</div>'}<section class="workSection"><div class="workSectionHead"><div><h3>配方內容</h3><p>記錄配方基準與建議食用方式，之後調整版本仍能沿用。</p></div><span class="sectionBadge">營養師填寫</span></div><div class="formulaMeta"><label>初步配方號碼 <span class="requiredHint">*</span><input id="sharedFormulaNo" placeholder="MA…………N0*" value="${safe(data['初步配方號碼']||'')}" ${done?'disabled':''}></label><label>配方用量基準<select id="formulaBasis" ${done?'disabled':''}>${['每顆','每錠','每包','每瓶','每日份'].map(v=>`<option ${data['配方用量基準']===v?'selected':''}>${v}</option>`).join('')}</select></label><label>建議食用方式<input id="formulaDirections" placeholder="例如：每日 2 顆，餐後食用" value="${safe(data['建議食用方式']||'')}" ${done?'disabled':''}></label></div><label style="display:block;margin-top:14px">配方備註<textarea id="formulaNote" style="width:100%;margin-top:6px;padding:11px;border:1px solid #d5deda;border-radius:9px;min-height:80px" placeholder="原料限制、替代方案、製程或調整提醒" ${done?'disabled':''}>${safe(data['配方備註']||'')}</textarea></label></section><section class="workSection"><div class="workSectionHead"><div><h3>報價內容</h3><p>營養師可先填原料成本與加工費用（皆為選填草案，非正式報價）。</p></div><span class="sectionBadge">業管可查看</span></div><div class="quoteGrid"><label>原料成本（元）<input type="number" min="0" step="0.01" id="rawCost" value="${safe(data['原料成本']||'')}" ${done?'disabled':''}></label><label>加工費用（元）<input type="number" min="0" step="0.01" id="manufacturingCost" value="${safe(data['加工費']||'')}" ${done?'disabled':''}></label></div></section><section class="workSection"><div class="workSectionHead"><div><h3>配方溝通調整紀錄</h3><p>與客戶來回修版的過程，每改一次就加一列：記錄日期、客戶要求、營養師回復與當版配方號碼／提交日期（對應原表配方第一～三次調整）。</p></div><span class="sectionBadge">營養師填寫</span></div><div class="adjustTable" id="adjustRows"></div>${done?'':'<button type="button" class="smallButton" id="addAdjust">＋ 新增一次調整</button>'}</section><section class="workSection"><div class="workSectionHead"><div><h3>內部交接說明</h3><p>記錄成本風險、客戶待確認事項，以及交給研發打樣的提醒。</p></div></div><div class="formGrid"><label class="wide">配方與報價處理說明<textarea id="sharedFormulaNote" placeholder="例如：指定原料價格波動較大，報價有效期 14 天" ${done?'disabled':''}>${safe(data['配方與報價說明']||task.note||'')}</textarea></label></div></section>${done?'':'<div class="actions"><button type="button" id="saveFormula">先儲存草稿</button><button class="primary" type="button" id="completeFormula">完成配方與報價，交給研發</button></div>'}`;

  const adjustRowHtml=(row,index)=>`<div class="adjustRow" data-adjust-row="${index}"><label>日期<input type="date" data-akey="date" value="${safe(row.date||'')}" ${done?'disabled':''}></label><label>客戶要求<textarea data-akey="request" placeholder="例如：降低甜味、換膠囊殼" ${done?'disabled':''}>${safe(row.request||'')}</textarea></label><label>營養師回復<textarea data-akey="reply" placeholder="例如：已調整甜味劑並更新配方" ${done?'disabled':''}>${safe(row.reply||'')}</textarea></label><label>配方號碼／提交日期<input data-akey="formulaNo" placeholder="例如：MA…N1／8/20" value="${safe(row.formulaNo||'')}" ${done?'disabled':''}></label>${done?'':'<button type="button" class="removeAdjust" aria-label="刪除這次調整">×</button>'}</div>`;
  const collectAdjust=()=>[...card.querySelectorAll('[data-adjust-row]')].map(row=>Object.fromEntries([...row.querySelectorAll('[data-akey]')].map(field=>[field.dataset.akey,field.value.trim()])));
  const renderAdjust=()=>{const box=card.querySelector('#adjustRows');if(!adjustRows.length){box.innerHTML='<div class="adjustEmpty">目前沒有配方調整紀錄。'+(done?'':'按「＋ 新增一次調整」開始記錄與客戶來回修版。')+'</div>';return}box.innerHTML=adjustRows.map(adjustRowHtml).join('');card.querySelectorAll('.removeAdjust').forEach((button,index)=>button.onclick=()=>{adjustRows=collectAdjust();adjustRows.splice(index,1);renderAdjust()})};
  renderAdjust();
  if(done)return;
  card.querySelector('#addAdjust').onclick=()=>{adjustRows=collectAdjust();adjustRows.push({date:'',request:'',reply:'',formulaNo:''});renderAdjust()};
  const saveFormula=complete=>{
    const formulaNo=card.querySelector('#sharedFormulaNo').value.trim();
    if(complete&&!formulaNo){toast('完成前請先填配方號碼');return}
    sharedCase.workflowData??={};
    Object.assign(sharedCase.workflowData,{'初步配方號碼':formulaNo,'配方用量基準':card.querySelector('#formulaBasis').value,'建議食用方式':card.querySelector('#formulaDirections').value.trim(),'配方溝通調整':collectAdjust().filter(r=>r.date||r.request||r.reply||r.formulaNo),'配方備註':card.querySelector('#formulaNote').value.trim(),'原料成本':card.querySelector('#rawCost').value,'加工費':card.querySelector('#manufacturingCost').value,'配方與報價說明':card.querySelector('#sharedFormulaNote').value.trim()});
    task.note=sharedCase.workflowData['配方與報價說明']||`配方 ${formulaNo}`;
    task.updatedAt=new Date().toISOString();
    sharedCase.activities??=[];
    if(complete){
      task.status='已完成';
      const next=(sharedCase.tasks||[]).find(item=>item.title==='樣品打樣');
      if(next){next.status='未開始';next.note=`等待研發依配方 ${formulaNo} 承接打樣`}
      sharedCase.activities.push({at:task.updatedAt,text:`營養師完成配方｜${formulaNo}`});
    }else{
      sharedCase.activities.push({at:task.updatedAt,text:'營養師儲存配方草稿'});
    }
    sharedCase.status=sharedCase.tasks.every(item=>item.status==='已完成')?'已完成':'進行中';
    BKECases.update(sharedCase);
    location.reload();
  };
  card.querySelector('#saveFormula').onclick=()=>saveFormula(false);
  card.querySelector('#completeFormula').onclick=()=>saveFormula(true);
}

function bindExport(){
  document.querySelector('#exportCaseBtn').onclick=()=>{
    const rows=[['欄位','內容'],['案件編號',sharedCase.id],['表單類型',sharedCase.type],['案件名稱',sharedCase.title||''],['客戶名稱',sharedCase.customer||''],['申請人員',sharedCase.applicant||''],['目前狀態',sharedCase.status||'進行中'],['建立時間',sharedCase.createdAt?new Date(sharedCase.createdAt).toLocaleString('zh-TW',{hour12:false}):''],['最後更新',sharedCase.updatedAt?new Date(sharedCase.updatedAt).toLocaleString('zh-TW',{hour12:false}):'']];
    const summary=sharedCase.summary||{};
    A_CORE_FIELDS.forEach(([key,label])=>{const value=summary[key];rows.push([label,summaryFilled(value)?summaryText(value):''])});
    A_OPTIONAL_FIELDS.forEach(key=>{const value=summary[key];if(summaryFilled(value))rows.push([key,summaryText(value)])});
    const wf=sharedCase.workflowData||{};
    ['收案日期','收案營養師','初步配方號碼','配方報價提交日期'].forEach(key=>{if(wf[key])rows.push([key,wf[key]])});
    if(Array.isArray(wf['配方溝通調整'])&&wf['配方溝通調整'].length){wf['配方溝通調整'].forEach((r,i)=>{rows.push([`配方調整第${i+1}次`,`日期：${r.date||'-'}｜客戶要求：${r.request||'-'}｜營養師回復：${r.reply||'-'}｜配方號碼／提交日期：${r.formulaNo||'-'}`])})}
    const csv='\ufeff'+rows.map(row=>row.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n');
    const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
    const a=document.createElement('a');a.href=url;a.download=`BKE_${sharedCase.id}.csv`;a.click();URL.revokeObjectURL(url);
    toast('本案資料已匯出 CSV');
  };
}
</script>
