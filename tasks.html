<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BKE 我的待辦</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f4f2;color:#17231f;font:14px Arial,"Noto Sans TC",sans-serif}button{font:inherit;cursor:pointer}.app{min-height:100vh;display:flex}.side{width:220px;background:#143f33;color:white;padding:28px 18px;position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column}.logo{font:700 27px Georgia;color:#e3bd69;padding:0 11px 26px;border-bottom:1px solid #ffffff24}.logo small{display:block;color:white;font:13px Arial;margin-top:5px}.nav{display:grid;gap:7px;margin-top:24px}.nav button{border:0;background:transparent;color:#bfd0ca;text-align:left;padding:13px;border-radius:9px}.nav .on{background:#ffffff17;color:white}.user{margin-top:auto;border-top:1px solid #ffffff24;padding:18px 10px 0}.main{margin-left:220px;width:calc(100% - 220px);padding:38px 48px}.top{display:flex;justify-content:space-between;align-items:flex-start}.eyebrow{font-size:11px;letter-spacing:.16em;color:#ad843a;font-weight:bold}h1{font:600 33px Georgia;margin:6px 0 8px}.top p{margin:0;color:#727d77}.switch{background:white;border:1px solid #dce3df;padding:5px;border-radius:10px;display:flex}.switch button{border:0;background:transparent;padding:9px 13px;border-radius:7px;color:#6f7974}.switch .on{background:#174f3d;color:white}.alert{margin:27px 0 17px;background:#fff7e5;border:1px solid #f0dcae;border-radius:12px;padding:15px 18px;color:#795514}.columns{display:grid;grid-template-columns:1.3fr 1fr;gap:18px}.card{background:white;border:1px solid #dfe6e2;border-radius:14px;overflow:hidden}.card h2{font:600 19px Georgia;margin:0;padding:19px 21px;border-bottom:1px solid #e4e9e6}.task{padding:17px 21px;border-bottom:1px solid #e8ece9;display:grid;grid-template-columns:1fr auto;gap:10px}.task:last-child{border:0}.task b{display:block;margin-bottom:5px}.task small{display:block;color:#7c8781}.task i{font-style:normal;border-radius:99px;padding:6px 10px;align-self:start;font-size:11px;font-weight:bold}.amber{background:#fff0d2;color:#855c00}.red{background:#fde6e4;color:#a7382e}.blue{background:#e3eefb;color:#2d6097}.task button{margin-top:12px;border:0;background:#174f3d;color:white;border-radius:7px;padding:8px 11px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:18px}.metric{border:1px solid #e2e7e4;border-radius:10px;padding:15px}.metric span{font-size:12px;color:#7d8782}.metric b{display:block;font:600 27px Georgia;margin-top:7px}.recent{padding:0 20px 17px}.recent p{border-bottom:1px solid #e6ebe8;padding-bottom:13px;color:#707b75}.recent b{display:block;color:#17231f;margin-bottom:4px}.empty{padding:40px;text-align:center;color:#78837d}@media(max-width:820px){.side{width:70px}.logo small,.nav button,.user{display:none}.main{margin-left:70px;width:calc(100% - 70px);padding:25px}.top{display:grid;gap:20px}.columns{grid-template-columns:1fr}}
</style></head><body><div class="app"><aside class="side"><div class="logo">BKE<small>代工需求管理</small></div><nav class="nav"><button onclick="location.href='preview.html'">案件工作台</button><button class="on">我的待辦</button><button onclick="location.href='case.html'">配方與打樣</button><button onclick="location.href='reports.html'">報表與匯出</button></nav><div class="user" id="userName">王小明<br><small>業管</small></div></aside><main class="main"><header class="top"><div><div class="eyebrow">MY WORK</div><h1 id="title">我的待辦</h1><p id="subtitle">只顯示目前分派給你的工作項目、案件進度與期限。</p></div><div class="switch"><button class="on" data-role="sales">業管</button><button data-role="nutrition">營養師</button><button data-role="rd">研發</button><button data-role="marketing">行銷顧問</button><button data-role="manager">主管</button><button onclick="location.href='role-portal.html'">角色入口</button></div></header><div class="alert" id="alert">案件頁分派給你的工作，會出現在這裡。</div><section class="columns"><div class="card"><h2 id="taskTitle">需要我處理</h2><div id="taskList"></div></div><div><section class="card"><h2>工作概況</h2><div class="metrics" id="metrics"></div></section><section class="card" style="margin-top:18px"><h2>最近動態</h2><div class="recent" id="recent"></div></section></div></section></main></div><script src="shared-case-store.js"></script><script>
const data={sales:{name:'王小明',type:'業管',tasks:[['日常營養補充膠囊','草稿尚未送出，建立於昨天 16:20','繼續填寫','amber']],metrics:[['我的草稿','1'],['退回補件','1'],['進行中','3'],['本月成單','2']]},nutrition:{name:'林營養師',type:'營養師',tasks:[['女性日常保養粉包','資料完整，等待接案','待接案','amber']],metrics:[['待接案','2'],['待回覆','1'],['配方中','4'],['本月完成','6']]},rd:{name:'陳研發',type:'研發',tasks:[],metrics:[['待收案','1'],['製作中','2'],['待提交','1'],['本月完成','5']]},marketing:{name:'行銷顧問',type:'行銷顧問',tasks:[],metrics:[['待承辦','0'],['進行中','0'],['等待確認','0'],['本月完成','0']]},manager:{name:'管理者',type:'主管',tasks:[],metrics:[['全部進行中','12'],['逾期案件','1'],['本月新案','18'],['本月成單','7']]}};
const userName=document.querySelector('#userName'),alertBox=document.querySelector('#alert'),taskList=document.querySelector('#taskList'),metrics=document.querySelector('#metrics'),recent=document.querySelector('#recent'),subtitle=document.querySelector('#subtitle');
const taskDefs=[['客戶需求確認','進度_需求確認_'],['配方評估與報價','進度_配方評估_'],['樣品打樣','進度_樣品打樣_'],['客戶確認與結案','進度_結案_']];
function safe(value){return String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))}
function roleMatch(owner,role){if(role==='manager')return true;if(role==='sales')return owner.includes('業管');if(role==='nutrition')return owner.includes('營養師');if(role==='rd')return owner.includes('研發');if(role==='marketing')return owner.includes('行銷顧問');return false}
function sharedTasks(role){const cases=window.BKECases?BKECases.all():[],modern=cases.flatMap(item=>(BKECases.availableTasks?BKECases.availableTasks(item):(item.tasks||[])).map(task=>{const p=BKECases.progress?.(BKECases.find?.(item.id)||item)||{percent:0};return{title:`${item.title}｜${task.title}`,owner:task.ownerName||'未指派',ownerRole:task.ownerRole||'',status:task.status||'未開始',due:task.due||'未設定',caseId:item.id,overdue:BKECases.isOverdue?.(task)||false,progress:p.percent,stalled:BKECases.stalledDays?.(BKECases.find?.(item.id)||item)||0,caseStatus:item.status||'進行中'}})).filter(task=>role==='manager'||roleMatch(`${task.owner==='未指派'?'':task.owner} ${task.ownerRole}`,role));if(cases.length)return modern;try{const saved=JSON.parse(localStorage.getItem('bke-a-case-demo-v2')||'{}'),legacy=taskDefs.map(([title,prefix])=>{const owner=saved[prefix+'負責人']||'未指派',status=saved[prefix+'狀態']||'未開始',due=saved[prefix+'期限']||'未設定';return {title,owner,status,due,overdue:false,progress:0,stalled:0}}).filter(task=>task.status!=='已完成'&&task.owner!=='未指派'&&roleMatch(task.owner,role));return legacy}catch{return modern}}
function statusTone(status,overdue){if(overdue)return'red';return status==='等待補件'?'red':status==='進行中'?'blue':'amber'}
function render(role){const d=data[role],hasCases=Boolean(window.BKECases?.all().length),live=sharedTasks(role),unassigned=live.filter(t=>t.owner==='未指派').length,waitingSupplement=live.filter(t=>t.status==='等待補件').length,overdueCount=live.filter(t=>t.overdue).length,avgProgress=live.length?Math.round(live.reduce((sum,t)=>sum+t.progress,0)/live.length):0,longest=live.reduce((max,t)=>Math.max(max,t.stalled||0),0),fixed=hasCases?[]:d.tasks.map(t=>({title:t[0],detail:t[1],status:t[2],tone:t[3]})),tasks=[...live.map(t=>({title:t.title,detail:`${t.owner==='未指派'?`尚未指定負責人｜角色：${t.ownerRole||'待確認'}`:`案件分派｜${t.owner}`}｜案件進度 ${t.progress}%｜停留 ${t.stalled} 天｜期限：${t.due}${t.status==='等待補件'?'｜退回補件':''}${t.overdue?'｜已逾期':''}`,status:t.overdue?(t.status==='等待補件'?'補件＋逾期':'已逾期'):t.owner==='未指派'?'待分派':t.status,tone:statusTone(t.status,t.overdue),live:true,url:t.caseId?`case.html?case=${encodeURIComponent(t.caseId)}`:'case.html'})),...fixed];userName.innerHTML=safe(d.name)+'<br><small>'+safe(d.type)+'</small>';subtitle.textContent=role==='manager'?'顯示目前已解鎖、尚未完成的工作、案件進度與期限。':'只顯示目前已輪到這個角色的工作；A 表後續角色會在前一關完成後才出現。';if(live.length){alertBox.textContent=role==='manager'?`目前 ${live.length} 項已解鎖工作｜平均案件進度 ${avgProgress}%｜${overdueCount} 項逾期｜最長停留 ${longest} 天。`:overdueCount?`目前 ${live.length} 項工作，其中 ${overdueCount} 項已逾期；平均案件進度 ${avgProgress}%。`:unassigned?`目前 ${live.length} 項工作，其中 ${unassigned} 項待分派；平均案件進度 ${avgProgress}%。`:`目前 ${live.length} 項案件工作｜平均案件進度 ${avgProgress}%｜最長停留 ${longest} 天。`}else alertBox.textContent=hasCases?'目前沒有已輪到這個角色的案件工作。':'目前沒有本機案件，以下為介面示範資料。';taskList.innerHTML=tasks.map(t=>`<div class="task"><div><b>${safe(t.title)}${t.live?'　<small style="display:inline;color:#29705a">來自案件進度</small>':''}</b><small>${safe(t.detail)}</small><button onclick="location.href='${t.url||'case.html'}'">${t.live?(t.status==='待分派'?'前往分派':'查看並更新'):'開始處理'}</button></div><i class="${t.tone}">${safe(t.status)}</i></div>`).join('')||'<div class="empty">目前沒有待辦</div>';const metricRows=hasCases?[["目前案件工作",String(live.length)],["平均案件進度",`${avgProgress}%`],["退回補件",String(waitingSupplement)],["已逾期",String(overdueCount)]]:[["目前案件工作",String(live.length)],["待分派",String(unassigned)],...d.metrics.slice(0,2)];metrics.innerHTML=metricRows.map(m=>`<div class="metric"><span>${safe(m[0])}</span><b>${safe(m[1])}</b></div>`).join('');const recentEvents=hasCases&&window.BKECases?BKECases.all().flatMap(item=>(BKECases.find?.(item.id)?.events||[]).map(event=>({...event,caseTitle:item.title}))).sort((a,b)=>String(b.at||'').localeCompare(String(a.at||''))).slice(0,4):[];recent.innerHTML=hasCases?(recentEvents.length?recentEvents.map(event=>`<p><b>${safe(event.caseTitle)}</b>${safe(event.text)}</p>`).join(''):'<p><b>目前尚無結構化活動</b>下一次工作更新後會開始累積負責人、狀態、期限與補件事件。</p>'):'<p><b>介面示範模式</b>建立 A／B／C 測試案件後，這裡會自動切換為本機案件資料</p>'}
function selectRole(role){const selected=data[role]?role:'sales';document.querySelectorAll('.switch [data-role]').forEach(x=>x.classList.toggle('on',x.dataset.role===selected));render(selected)}
document.querySelectorAll('.switch [data-role]').forEach(b=>b.onclick=()=>{const url=new URL(location.href);url.searchParams.set('role',b.dataset.role);history.replaceState(null,'',url);selectRole(b.dataset.role)});selectRole(new URLSearchParams(location.search).get('role')||'sales');
</script></body></html>
