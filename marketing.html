<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BKE｜行銷顧問工作台</title>
  <style>
    :root{--ink:#17231f;--muted:#6c7872;--green:#174f3d;--brown:#8f5334;--line:#dfe6e2;--red:#a83d35;--amber:#926417;--purple:#684d82}*{box-sizing:border-box}body{margin:0;background:#f3f4f2;color:var(--ink);font:14px Arial,"Noto Sans TC",sans-serif}button,input{font:inherit}.app{min-height:100vh;display:flex}.side{position:fixed;inset:0 auto 0 0;width:224px;background:#3d3029;color:#fff;padding:26px 18px;display:flex;flex-direction:column}.logo{font:700 27px Georgia;color:#e5bd69;padding:0 11px 23px;border-bottom:1px solid #ffffff20}.logo small{display:block;font:12px Arial;color:#fff;letter-spacing:.1em;margin-top:6px}.role{margin:20px 5px 10px;padding:12px;background:#ffffff10;border-radius:10px}.role small{color:#daccc5}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:#dccfc8;text-align:left;padding:12px;border-radius:9px;cursor:pointer}.nav .on,.nav button:hover{background:#ffffff16;color:#fff}.profile{margin-top:auto;border-top:1px solid #ffffff20;padding:17px 8px;line-height:1.5}.profile small{color:#d8c9c1}.main{margin-left:224px;width:calc(100% - 224px);padding:36px 44px 70px}.top{display:flex;justify-content:space-between;gap:20px;align-items:center}.eyebrow{font-size:11px;color:#a46b44;letter-spacing:.16em;font-weight:700}.top h1{font:600 34px Georgia;margin:5px 0 7px}.top p{margin:0;color:var(--muted)}.topActions{display:flex;gap:9px}.topActions button{border:1px solid #d5ded9;background:#fff;border-radius:9px;padding:10px 13px;cursor:pointer}.notice{margin:22px 0 18px;border:1px solid #ead6aa;background:#fff8e8;color:#71511b;border-radius:10px;padding:11px 14px;line-height:1.55}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:22px}.stat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:17px}.stat span{color:var(--muted)}.stat b{float:right;font:600 27px Georgia}.stat small{display:block;color:#8a958f;margin-top:12px}.stat.alert b{color:var(--red)}.toolbar{display:flex;justify-content:space-between;gap:16px;margin-bottom:12px}.tabs{display:flex;gap:5px;flex-wrap:wrap}.tabs button{border:0;background:transparent;padding:9px 12px;color:#69766f;border-radius:8px;cursor:pointer}.tabs button.on{background:#eee5df;color:#79462d;font-weight:700}.search{border:1px solid #d6dfda;background:#fff;border-radius:9px;padding:10px 13px;width:270px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}.queue{display:grid;gap:12px}.case{background:#fff;border:1px solid var(--line);border-radius:14px;padding:19px 20px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;box-shadow:0 8px 24px #35251f08}.case.overdue{border-color:#e6bbb7}.case.waiting{border-color:#e5cf9f}.case.completed{opacity:.78}.caseTop{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.case h2{font-size:17px;margin:8px 0 6px}.case p{color:var(--muted);margin:0;line-height:1.55}.meta{display:flex;flex-wrap:wrap;gap:7px 15px;color:#78837e;font-size:12px;margin-top:12px}.pill{display:inline-block;border-radius:99px;padding:5px 9px;font-size:11px;font-weight:700}.pill.new{background:#f2e8e1;color:#7e492f}.pill.active{background:#e2f1ea;color:#1a5c45}.pill.waiting{background:#fff0d4;color:#815a16}.pill.overdue{background:#fde7e5;color:#9a3730}.pill.completed{background:#ecefed;color:#56615c}.detail{margin-top:13px;padding:10px 12px;border-radius:9px;background:#f5f7f6;color:#4a5a53;font-size:12px;line-height:1.55}.detail.waiting{background:#fff8e9;color:#76551e}.actions{display:flex;flex-direction:column;gap:8px;min-width:120px;justify-content:center}.actions button{border:1px solid #d7e0db;background:#fff;border-radius:9px;padding:10px 12px;cursor:pointer}.actions .primary{background:#8f5334;border-color:#8f5334;color:#fff}.aside{display:grid;gap:14px;position:sticky;top:20px}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:19px}.panel h3{font:600 17px Georgia;margin:0 0 13px}.priority{padding:11px 0;border-top:1px solid #edf0ee}.priority:first-of-type{border-top:0}.priority b{display:block;margin-bottom:4px}.priority small{display:block;color:var(--muted);line-height:1.5}.capacity{display:grid;grid-template-columns:1fr auto;gap:9px;padding:8px 0}.capacity span{color:var(--muted)}.empty{background:#fff;border:1px dashed #cfd9d4;border-radius:14px;padding:42px 24px;text-align:center;color:var(--muted);line-height:1.7}.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:5px}@media(max-width:980px){.layout{grid-template-columns:1fr}.aside{position:static}.stats{grid-template-columns:1fr 1fr}}@media(max-width:720px){.side{position:static;width:68px;padding:20px 10px}.logo{font-size:21px;padding:0 2px 18px}.logo small,.role,.nav button,.profile{font-size:0}.nav button{height:43px;padding:0}.nav button::before{content:'•';font-size:24px}.nav button.on::before{content:'●'}.main{margin:0;width:calc(100% - 68px);padding:24px 14px 60px}.top{align-items:flex-start}.top h1{font-size:27px}.topActions{display:none}.stats{grid-template-columns:1fr 1fr}.toolbar{display:grid}.search{width:100%}.case{grid-template-columns:1fr}.actions{flex-direction:row}.actions button{flex:1}.meta{display:grid}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="side"><div class="logo">BKE<small>代工需求管理</small></div><div class="role">行銷顧問工作台<br><small>審稿、簡報與教育訓練</small></div><nav class="nav"><button class="on">我的案件</button><button onclick="location.href='tasks.html?role=marketing'">我的待辦</button><button onclick="location.href='preview.html'">案件工作台</button><button onclick="BKECases.openDeleteManager()">🗑 刪除案件</button><button onclick="location.href='role-portal.html'">切換角色</button></nav><div class="profile">行銷顧問<br><small>行銷顧問角色</small></div></aside>
    <main class="main">
      <header class="top"><div><div class="eyebrow">MARKETING WORKSPACE</div><h1>行銷需求與下一步</h1><p>先承接新工作與逾期項目，再處理審稿、簡報及授課安排。</p></div><div class="topActions"><button onclick="location.href='role-portal.html'">切換角色</button><button onclick="location.href='tasks.html?role=marketing'">查看待辦</button></div></header>
      <div class="notice" id="notice">目前只會顯示這台裝置中的匿名測試案件；正式多人同步仍需接上資料庫。</div>
      <section class="stats"><div class="stat"><span>等待承接</span><b id="newStat">0</b><small>尚未指定負責人</small></div><div class="stat"><span>進行中</span><b id="activeStat">0</b><small>目前由行銷處理</small></div><div class="stat"><span>等待別人</span><b id="waitingStat">0</b><small>補件或外部確認</small></div><div class="stat alert"><span>已逾期</span><b id="overdueStat">0</b><small>需要優先處理</small></div></section>
      <div class="toolbar"><div class="tabs" id="tabs"><button class="on" data-filter="current">目前工作</button><button data-filter="new">待承接</button><button data-filter="active">進行中</button><button data-filter="waiting">等別人</button><button data-filter="overdue">已逾期</button><button data-filter="completed">已完成／歷史</button></div><input class="search" id="search" aria-label="搜尋案件" placeholder="搜尋案件、客戶或工作"></div>
      <section class="layout">
        <div><div class="queue" id="queue"></div><div class="empty" id="empty" hidden><b>目前沒有符合條件的行銷工作</b>建立 C 表或在 B 表提出行銷服務後，工作會自動顯示在這裡。</div></div>
        <aside class="aside"><section class="panel"><h3>現在先做什麼</h3><div id="priorities"></div></section><section class="panel"><h3>工作概況</h3><div class="capacity"><span>全部行銷工作</span><b id="allCount">0</b></div><div class="capacity"><span>待分派</span><b id="unassignedCount">0</b></div><div class="capacity"><span>等待確認</span><b id="confirmCount">0</b></div><div class="capacity"><span>已完成</span><b id="doneCount">0</b></div></section></aside>
      </section>
    </main>
  </div>
  <script src="shared-case-store.js"></script>
  <script>
    const queue=document.querySelector('#queue'),empty=document.querySelector('#empty'),search=document.querySelector('#search'),tabs=[...document.querySelectorAll('#tabs button')];let filter='current',rows=[];
    function safe(value){return String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))}
    function marketingTask(task){return task.ownerRole==='行銷顧問'||task.returnToRole==='行銷顧問'||task.ownerName==='行銷顧問'}
    function state(task){if(task.status==='已完成')return'completed';if(BKECases.isOverdue(task))return'overdue';if(task.status==='等待補件'||task.returnToRole==='行銷顧問')return'waiting';if(task.ownerName==='未指派')return'new';return'active'}
    function stateLabel(task){const current=state(task);if(current==='completed')return'已完成';if(current==='overdue')return'已逾期';if(current==='waiting')return task.status==='等待補件'?'等待業管補件':'等待確認';if(current==='new')return'等待承接';return task.status||'進行中'}
    function sortValue(row){const order={overdue:0,waiting:1,new:2,active:3,completed:4};return order[state(row.task)]*1e15-(new Date(row.task.updatedAt||row.item.updatedAt||0).getTime())}
    function card(row){const {item,task}=row,current=state(task),owner=task.ownerName==='未指派'?`${task.ownerRole}（待分派）`:task.ownerName,due=task.due||'未設定';return `<article class="case ${current}" data-state="${current}" data-search="${safe(`${item.title} ${item.customer} ${item.applicant} ${task.title}`.toLowerCase())}"><div><div class="caseTop"><span class="pill ${current}">${safe(stateLabel(task))}</span><span class="pill active">${safe(item.type)} 表案件</span></div><h2>${safe(item.title)}</h2><p>${safe(task.title)}</p><div class="meta"><span>${safe(item.customer)}</span><span>申請人：${safe(item.applicant)}</span><span>負責人：${safe(owner)}</span><span>期限：${safe(due)}</span></div><div class="detail ${current==='waiting'?'waiting':''}">${safe(task.note||`下一步：${task.title}｜${stateLabel(task)}`)}</div></div><div class="actions"><button class="primary" onclick="location.href='case.html?case=${encodeURIComponent(item.id)}'">${current==='new'?'前往承接':current==='completed'?'查看紀錄':'查看並更新'}</button></div></article>`}
    function draw(){const query=search.value.trim().toLowerCase(),visible=rows.filter(row=>(filter==='current'?state(row.task)!=='completed':state(row.task)===filter)&&(!query||`${row.item.title} ${row.item.customer} ${row.item.applicant} ${row.task.title}`.toLowerCase().includes(query)));queue.innerHTML=visible.map(card).join('');empty.textContent=filter==='completed'?'目前沒有已完成的行銷歷史工作':'目前沒有符合條件的行銷工作';empty.hidden=visible.length>0}
    function priorityList(){const current=rows.filter(row=>state(row.task)!=='completed').slice(0,3);document.querySelector('#priorities').innerHTML=current.length?current.map(row=>`<div class="priority"><b>${safe(row.task.title)}</b><small>${safe(row.item.title)}｜${safe(stateLabel(row.task))}${row.task.due?`｜期限 ${safe(row.task.due)}`:''}</small></div>`).join(''):'<div class="priority"><b>目前沒有待處理工作</b><small>新需求建立後會依優先順序顯示。</small></div>'}
    function load(){const cases=window.BKECases?BKECases.all():[];rows=cases.flatMap(item=>(item.tasks||[]).filter(marketingTask).map(task=>({item,task}))).sort((a,b)=>sortValue(a)-sortValue(b));const count=name=>rows.filter(row=>state(row.task)===name).length;document.querySelector('#newStat').textContent=count('new');document.querySelector('#activeStat').textContent=count('active');document.querySelector('#waitingStat').textContent=count('waiting');document.querySelector('#overdueStat').textContent=count('overdue');document.querySelector('#allCount').textContent=rows.length;document.querySelector('#unassignedCount').textContent=count('new');document.querySelector('#confirmCount').textContent=rows.filter(row=>row.task.status==='等待確認').length;document.querySelector('#doneCount').textContent=count('completed');document.querySelector('#notice').textContent=rows.length?`目前顯示 ${rows.length} 項從案件同步過來的行銷工作；狀態、期限與備註請在案件頁更新。`:'目前沒有行銷工作；建立 C 表或在 B 表提出行銷服務後，會自動顯示在這裡。';priorityList();draw()}
    tabs.forEach(button=>button.onclick=()=>{tabs.forEach(item=>item.classList.remove('on'));button.classList.add('on');filter=button.dataset.filter;draw()});search.oninput=draw;load();
  </script>
</body>
</html>
