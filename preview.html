<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BKE 代工需求管理</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f3;color:#182620;font:14px Arial,"Noto Sans TC",sans-serif}button,input{font:inherit}.app{min-height:100vh;display:flex}.side{width:220px;position:fixed;inset:0 auto 0 0;background:#133d31;color:white;padding:28px 18px;display:flex;flex-direction:column}.logo{font:700 28px Georgia;color:#e6bd68;padding:0 12px 26px;border-bottom:1px solid #ffffff24}.logo small{display:block;color:white;font:13px Arial;margin-top:6px;letter-spacing:.12em}.nav{display:grid;gap:8px;margin-top:24px}.nav button{border:0;background:transparent;color:#bfd0ca;text-align:left;padding:13px;border-radius:9px}.nav .on{background:#ffffff16;color:white}.profile{margin-top:auto;border-top:1px solid #ffffff24;padding-top:18px;cursor:pointer}.main{margin-left:220px;padding:40px 50px;width:calc(100% - 220px)}header{display:flex;justify-content:space-between;align-items:center}.eyebrow{font-size:11px;letter-spacing:.16em;color:#b28739;font-weight:bold}h1{font:600 34px Georgia;margin:5px 0 7px}header p{color:#6f7a75;margin:0}.primary{border:0;border-radius:9px;background:#174f3d;color:white;padding:13px 20px;cursor:pointer}.notice{margin:24px 0 0;border:1px solid #ead6aa;background:#fff8e8;color:#71511b;border-radius:10px;padding:11px 14px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin:18px 0 30px}.stat{background:white;border:1px solid #e0e6e2;border-radius:13px;padding:18px}.stat b{font:600 29px Georgia;float:right}.stat small{display:block;color:#929c97;margin-top:12px}.bar{display:flex;justify-content:space-between;margin-bottom:13px}.tabs{display:flex;gap:4px;flex-wrap:wrap}.tabs button{border:0;background:transparent;padding:9px 12px;color:#6d7773;cursor:pointer}.tabs .on{background:#dfeae5;color:#174f3d;border-radius:8px;font-weight:bold}.bar input{width:260px;border:1px solid #dce3df;border-radius:9px;padding:10px 13px}.list{background:white;border:1px solid #e0e6e2;border-radius:14px;overflow:hidden}.head,.row{display:grid;grid-template-columns:2fr 1fr 1fr .8fr;gap:20px;padding:15px 20px}.head{background:#fafbf9;color:#87918d;font-size:11px}.row{border-top:1px solid #e7ebe8;align-items:center;cursor:pointer}.row:hover{background:#fafcfb}.row[hidden]{display:none}.row span{display:grid;gap:5px}.row small{color:#8b9590}.pill{justify-self:start;padding:6px 10px;border-radius:99px;font-size:12px;font-weight:bold}.blue{background:#e3eefb;color:#2e6097}.amber{background:#fff0d3;color:#886000}.red{background:#fde7e5;color:#a8322a}.green{background:#e1f1e9;color:#216547}.empty{display:none;padding:36px;text-align:center;color:#7d8883;border-top:1px solid #e7ebe8}@media(max-width:800px){.side{width:70px}.logo small,.nav button,.profile{display:none}.main{margin-left:70px;width:calc(100% - 70px);padding:24px}.stats{grid-template-columns:1fr 1fr}.bar{display:grid;gap:12px}.bar input{width:100%}.head{display:none}.row{grid-template-columns:1fr 1fr}.row span:first-child{grid-column:1/-1}}
</style></head><body><div class="app"><aside class="side"><div class="logo">BKE<small>代工需求管理</small></div><div class="nav"><button class="on">案件工作台</button><button onclick="location.href='tasks.html'">我的待辦</button><button onclick="location.href='case.html'">配方與打樣</button><button onclick="location.href='reports.html'">報表與匯出</button></div><div class="profile" onclick="location.href='role-portal.html'" title="切換角色">管理者<br><small>測試環境</small></div></aside><main class="main"><header><div><div class="eyebrow">OEM / ODM WORKSPACE</div><h1>需求案件工作台</h1><p>從需求建立、角色承接到案件進度，都使用同一份本機測試資料。</p></div><button class="primary" onclick="location.href='form-versions.html'">＋ 新增需求</button></header><div class="notice" id="notice">目前為前台原型，同一瀏覽器建立的 A／B／C 測試案件會顯示在這裡。</div><section class="stats"><div class="stat">待承接工作<b id="pendingStat">0</b><small>尚未指定負責人</small></div><div class="stat">退回補件<b id="returnStat">0</b><small>需要業管補充</small></div><div class="stat">進行中<b id="progressStat">0</b><small>至少一項工作未完成</small></div><div class="stat">已完成<b id="doneStat">0</b><small>全部工作項目完成</small></div></section><div class="bar"><div class="tabs" id="caseTabs"><button class="on" data-filter="all">全部</button><button data-filter="pending">待承接</button><button data-filter="return">退回補件</button><button data-filter="progress">進行中</button><button data-filter="done">已完成</button></div><input id="caseSearch" placeholder="搜尋客戶、案件或負責人"></div><section class="list" id="caseList"><div class="head"><span>案件／客戶</span><span>目前承辦</span><span>目前狀態</span><span>最後更新</span></div><div class="empty" id="empty">目前沒有符合條件的案件</div></section></main></div><script src="shared-case-store.js"></script><script>
function safe(value){return String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))}
function openTasks(item){return (item.tasks||[]).filter(task=>task.status!=='已完成')}
function activeTask(item){return openTasks(item)[0]||null}
function group(item){const tasks=openTasks(item),active=tasks[0];if(!active)return'done';if(tasks.some(task=>task.status==='等待補件')||String(item.status).includes('退回'))return'return';if(tasks.some(task=>task.ownerName==='未指派'))return'pending';return'progress'}
function tone(status){if(status==='return')return'red';if(status==='done')return'green';if(status==='pending')return'amber';return'blue'}
function workSummary(item){const tasks=openTasks(item);if(!tasks.length)return{owner:'已完成',detail:'無待辦'};if(item.type!=='A'&&tasks.length>1){const roles=[...new Set(tasks.map(task=>task.ownerRole||'待確認'))];return{owner:`${tasks.length} 項並行`,detail:roles.join('、')}}const task=tasks[0];return{owner:task.ownerName==='未指派'?`${task.ownerRole}（待分派）`:task.ownerName,detail:task.title}}
const list=document.querySelector('#caseList'),empty=document.querySelector('#empty'),search=document.querySelector('#caseSearch'),tabs=[...document.querySelectorAll('#caseTabs button')];let filter='all';
function renderRows(){const cases=window.BKECases?BKECases.all():[];list.querySelectorAll('.row').forEach(row=>row.remove());cases.forEach(item=>{const summary=workSummary(item),status=group(item),row=document.createElement('div');row.className='row';row.dataset.status=status;row.dataset.search=`${item.title} ${item.customer} ${item.applicant} ${summary.owner} ${summary.detail}`.toLowerCase();row.onclick=()=>location.href=`case.html?case=${encodeURIComponent(item.id)}`;row.innerHTML=`<span><b>${safe(item.title)}</b><small>${safe(item.customer)} · ${safe(item.type)} 表測試案件</small></span><span>${safe(summary.owner)}<small>${safe(summary.detail)}</small></span><i class="pill ${tone(status)}">${status==='pending'?'待承接':status==='return'?'退回補件':status==='done'?'已完成':safe(item.status||'進行中')}</i><span>${safe(new Date(item.updatedAt).toLocaleString('zh-TW',{hour12:false}))}<small>查看詳情 →</small></span>`;list.insertBefore(row,empty)});const tasks=cases.flatMap(item=>item.tasks||[]);document.querySelector('#pendingStat').textContent=tasks.filter(task=>task.status!=='已完成'&&task.ownerName==='未指派').length;document.querySelector('#returnStat').textContent=cases.filter(item=>group(item)==='return').length;document.querySelector('#progressStat').textContent=cases.filter(item=>group(item)!=='done').length;document.querySelector('#doneStat').textContent=cases.filter(item=>group(item)==='done').length;document.querySelector('#notice').textContent=cases.length?`目前共有 ${cases.length} 筆本機測試案件；這裡與角色待辦、案件頁及主管總覽讀取同一份資料。`:'目前尚未建立本機測試案件，可從「新增需求」建立 A／B／C 任一需求。';applyFilter()}
function applyFilter(){const q=search.value.trim().toLowerCase(),rows=[...list.querySelectorAll('.row')];let shown=0;rows.forEach(row=>{const visible=(filter==='all'||row.dataset.status===filter)&&(!q||row.dataset.search.includes(q));row.hidden=!visible;if(visible)shown++});empty.style.display=shown?'none':'block'}
tabs.forEach(button=>button.onclick=()=>{tabs.forEach(x=>x.classList.remove('on'));button.classList.add('on');filter=button.dataset.filter;applyFilter()});search.oninput=applyFilter;renderRows();
</script></body></html>
