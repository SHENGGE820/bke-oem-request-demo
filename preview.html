<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BKE 代工需求管理</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f3;color:#182620;font:14px Arial,"Noto Sans TC",sans-serif}button,input{font:inherit}.app{min-height:100vh;display:flex}.side{width:220px;position:fixed;inset:0 auto 0 0;background:#133d31;color:white;padding:28px 18px;display:flex;flex-direction:column}.logo{font:700 28px Georgia;color:#e6bd68;padding:0 12px 26px;border-bottom:1px solid #ffffff24}.logo small{display:block;color:white;font:13px Arial;margin-top:6px;letter-spacing:.12em}.nav{display:grid;gap:8px;margin-top:24px}.nav button{border:0;background:transparent;color:#bfd0ca;text-align:left;padding:13px;border-radius:9px}.nav .on{background:#ffffff16;color:white}.profile{margin-top:auto;border-top:1px solid #ffffff24;padding-top:18px}.main{margin-left:220px;padding:40px 50px;width:calc(100% - 220px)}header{display:flex;justify-content:space-between;align-items:center}.eyebrow{font-size:11px;letter-spacing:.16em;color:#b28739;font-weight:bold}h1{font:600 34px Georgia;margin:5px 0 7px}header p{color:#6f7a75;margin:0}.primary{border:0;border-radius:9px;background:#174f3d;color:white;padding:13px 20px;cursor:pointer}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin:30px 0}.stat{background:white;border:1px solid #e0e6e2;border-radius:13px;padding:18px}.stat b{font:600 29px Georgia;float:right}.stat small{display:block;color:#929c97;margin-top:12px}.bar{display:flex;justify-content:space-between;margin-bottom:13px}.tabs button{border:0;background:transparent;padding:9px 12px;color:#6d7773}.tabs .on{background:#dfeae5;color:#174f3d;border-radius:8px;font-weight:bold}.bar input{width:260px;border:1px solid #dce3df;border-radius:9px;padding:10px 13px}.list{background:white;border:1px solid #e0e6e2;border-radius:14px;overflow:hidden}.head,.row{display:grid;grid-template-columns:2fr 1fr 1fr .8fr;gap:20px;padding:15px 20px}.head{background:#fafbf9;color:#87918d;font-size:11px}.row{border-top:1px solid #e7ebe8;align-items:center;cursor:pointer}.row:hover{background:#fafcfb}.row span{display:grid;gap:5px}.row small{color:#8b9590}.pill{justify-self:start;padding:6px 10px;border-radius:99px;font-size:12px;font-weight:bold}.blue{background:#e3eefb;color:#2e6097}.amber{background:#fff0d3;color:#886000}.modal{display:none;position:fixed;inset:0;background:#10231cba;place-items:center;padding:25px}.modal.show{display:grid}.panel{background:white;border-radius:18px;width:min(820px,95vw);max-height:92vh;overflow:auto}.ph{padding:25px 30px;border-bottom:1px solid #e0e6e2;display:flex;justify-content:space-between}.ph h2{font:600 27px Georgia;margin:3px 0}.close{border:0;background:none;font-size:28px}.steps{text-align:center;background:#f7f6f0;padding:18px;color:#174f3d}.fields{padding:28px 30px;display:grid;grid-template-columns:1fr 1fr;gap:18px}.fields label{display:grid;gap:7px;font-weight:bold;font-size:13px}.fields .wide{grid-column:1/-1}.fields input,.fields textarea,.fields select{padding:12px;border:1px solid #d7ddda;border-radius:8px;font-weight:normal}.fields textarea{min-height:78px}.foot{padding:18px 30px;border-top:1px solid #e0e6e2;display:flex;justify-content:flex-end;gap:10px}.foot button{padding:11px 17px;border:1px solid #d7ddda;background:white;border-radius:8px}.foot .primary{background:#174f3d;color:white}@media(max-width:800px){.side{width:70px}.logo small,.nav button,.profile{display:none}.main{margin-left:70px;width:calc(100% - 70px);padding:24px}.stats{grid-template-columns:1fr 1fr}.bar{display:grid;gap:12px}.head{display:none}.row{grid-template-columns:1fr 1fr}.fields{grid-template-columns:1fr}.fields .wide{grid-column:auto}}
</style></head><body><div class="app"><aside class="side"><div class="logo">BKE<small>代工需求管理</small></div><div class="nav"><button class="on">案件工作台</button><button onclick="location.href='tasks.html'">我的待辦</button><button onclick="location.href='case.html'">配方與打樣</button><button onclick="location.href='reports.html'">報表與匯出</button></div><div class="profile">管理者<br><small>測試環境</small></div></aside><main class="main"><header><div><div class="eyebrow">OEM / ODM WORKSPACE</div><h1>需求案件工作台</h1><p>業管與營養師在同一個地方完成需求、配方與打樣。</p></div><button class="primary" onclick="location.href='wizard.html'">＋ 新增需求</button></header><section class="stats"><div class="stat">待營養師處理<b>1</b><small>等待接案</small></div><div class="stat">退回補件<b>0</b><small>需要業管補充</small></div><div class="stat">進行中<b>1</b><small>配方或打樣中</small></div><div class="stat">已結案<b>0</b><small>已完成案件</small></div></section><div class="bar"><div class="tabs"><button class="on">全部</button><button>草稿</button><button>待營養師處理</button><button>進行中</button><button>已結案</button></div><input placeholder="搜尋客戶、案件或負責人"></div><section class="list"><div class="head"><span>案件／客戶</span><span>負責人</span><span>目前狀態</span><span>最後更新</span></div><div class="row" onclick="location.href='case.html'" style="cursor:pointer"><span><b>護眼膠囊代工需求</b><small>測試客戶 A · 保健食品</small></span><span>王小明<small>林營養師</small></span><i class="pill blue">進行中</i><span>今天 10:32<small>查看詳情 →</small></span></div><div class="row" onclick="location.href='case.html'" style="cursor:pointer"><span><b>日常營養補充膠囊</b><small>測試客戶 B · 保健食品</small></span><span>陳業管<small>尚未指派</small></span><i class="pill amber">待營養師處理</i><span>昨天 16:20<small>查看詳情 →</small></span></div></section></main></div><div class="modal" id="modal"><form class="panel" onsubmit="event.preventDefault();location.href='wizard.html'"><div class="ph"><div><small>建立新案件</small><h2>客戶代工需求</h2><span>只需先填清楚的核心資料，後續再逐步補齊。</span></div><button type="button" class="close" onclick="modal.classList.remove('show')">×</button></div><div class="steps">● 基本資料　━━━━　○ 產品需求　━━━━　○ 確認送出</div><div class="fields"><label>案件名稱<input required placeholder="例如：護眼軟膠囊代工需求"></label><label>客戶名稱<input required></label><label>負責業管<input required></label><label>產品類別<select><option>保健食品</option><option>寵物保健品</option></select></label><label class="wide">目標族群<input required placeholder="例如：長時間使用 3C 的上班族"></label><label class="wide">客戶原始需求<textarea required placeholder="用客戶的說法記錄需求，營養師比較容易判斷。"></textarea></label><label>預計劑型<input placeholder="膠囊、粉包、錠劑…"></label><label>目標成本<input placeholder="例如：每顆 15 元內"></label></div><div class="foot"><button type="button" onclick="modal.classList.remove('show')">取消</button><button class="primary">建立草稿</button></div></form></div></body></html>
